<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0f">
<title>CarDatax — Dealer Platform</title>
<link rel="icon" href="/m/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f;--bg2:#0c1018;--card:#101520;--card2:#141a28;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.10);
  --green:#00e68a;--green-d:#00cc7d;--green-soft:rgba(0,230,138,.06);--green-border:rgba(0,230,138,.18);
  --orange:#f5a623;--red:#ef4444;--blue:#4a9eff;
  --text:#e8ecf4;--text2:#8892a8;--text3:#505a70;--text4:#333850;
  --radius:14px;--radius-sm:10px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --font:'Outfit',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
button{font-family:var(--font);cursor:pointer}
input,select{font-family:var(--font)}

/* ══ LAYOUT ══ */
.app{display:flex;height:100vh}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px 28px}

/* ══ SIDEBAR ══ */
.sb-logo{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sb-logo img{height:28px}
.sb-logo-text{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase}
.sb-nav{padding:10px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);border:1px solid transparent;background:none;width:100%;text-align:left;transition:.15s}
.sb-item:hover{background:rgba(255,255,255,.03);color:var(--text)}
.sb-item.active{background:var(--green-soft);color:var(--green);border-color:var(--green-border)}
.sb-item svg{width:18px;height:18px;flex-shrink:0;opacity:.6}
.sb-item.active svg{opacity:1;stroke:var(--green)}
.sb-divider{height:1px;background:var(--border);margin:6px 16px}
.sb-label{font-size:9px;font-weight:700;color:var(--text4);letter-spacing:1.5px;text-transform:uppercase;padding:8px 18px 4px}
.sb-list{flex:1;overflow-y:auto;padding:4px 10px}
.sb-entry{padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.15s;margin-bottom:2px}
.sb-entry:hover{background:rgba(255,255,255,.03);border-color:var(--border2)}
.sb-plate{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--text)}
.sb-car{font-size:11px;color:var(--text3);margin-top:2px}
.sb-price{font-size:12px;color:var(--green);font-weight:600;margin-top:3px}
.sb-bottom{padding:12px;border-top:1px solid var(--border);margin-top:auto}

/* ══ TOPBAR ══ */
.tb-title{font-weight:700;font-size:15px}
.tb-spacer{flex:1}
.tb-btn{background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text2);padding:7px 14px;font-size:12px;font-weight:500;transition:.15s}
.tb-btn:hover{border-color:var(--green-border);color:var(--green);background:var(--green-soft)}

/* ══ PANELS ══ */
.panel{display:none}.panel.active{display:block}

/* ══ TAXATIE FORM ══ */
.tax-form{max-width:560px;margin:40px auto 0}
.tax-form-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:6px}
.tax-form-sub{font-size:13px;color:var(--text3);text-align:center;margin-bottom:28px}
.plate-wrap{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;border:2px solid var(--border2);height:60px;margin-bottom:16px;transition:.2s}
.plate-wrap:focus-within{border-color:var(--green)}
.plate-nl{width:44px;background:#003da5;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate-nl-stars{font-size:6px;color:#ffd700}
.plate-nl-code{font-size:14px;font-weight:800;color:#fff}
.plate-input{flex:1;background:#f5c518;border:none;outline:none;font-size:28px;font-weight:800;color:#1a1a1a;text-align:center;letter-spacing:3px;text-transform:uppercase;padding:0 10px;font-family:var(--mono)}
.plate-input::placeholder{color:rgba(0,0,0,.2);font-size:18px;letter-spacing:1px}
.km-wrap{position:relative;margin-bottom:16px}
.km-input{width:100%;background:var(--card);border:1.5px solid var(--border2);border-radius:var(--radius-sm);padding:14px 50px 14px 16px;font-size:18px;font-weight:600;color:var(--text);outline:none;font-family:var(--mono);transition:.2s}
.km-input:focus{border-color:var(--green)}
.km-input::placeholder{color:var(--text4)}
.km-suf{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;font-weight:500}
.tax-btn{width:100%;height:56px;background:var(--green);border:none;border-radius:14px;font-size:16px;font-weight:800;color:#000;letter-spacing:.3px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px}
.tax-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.tax-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.tax-error{color:var(--red);font-size:12px;text-align:center;margin-top:12px;min-height:18px}
.recent-chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.recent-chip{padding:6px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--card);color:var(--text2);font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:.5px;transition:.15s}
.recent-chip:hover{border-color:var(--green-border);color:var(--green);background:var(--green-soft)}

/* ══ LOADING ══ */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ld-text{font-size:15px;color:var(--text2);font-weight:600}
.ld-steps{margin-top:16px;text-align:left}
.ld-step{font-size:12px;color:var(--text4);padding:5px 0;display:flex;align-items:center;gap:8px}
.ld-step::before{content:'○';font-size:10px}
.ld-step.active{color:var(--green)}.ld-step.active::before{content:'◉'}
.ld-step.done{color:var(--text3)}.ld-step.done::before{content:'✓';color:var(--green)}

/* ══ RESULT: 5 PRICE CARDS ══ */
.price-row{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:10px;margin-bottom:20px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.15s}
.pcard:hover{border-color:var(--border2)}
.pcard-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.pcard-val{font-size:26px;font-weight:800;font-family:var(--mono);color:var(--text);letter-spacing:-1px;line-height:1.1}
.pcard-sub{font-size:11px;color:var(--text3);margin-top:5px}
.pcard-sub b{color:var(--text2)}
.pcard.advies{background:linear-gradient(135deg,rgba(0,230,138,.04),rgba(0,230,138,.01));border-color:var(--green-border)}
.advies-verdict{font-size:15px;font-weight:700;color:var(--text);margin-top:2px}
.advies-checks{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.advies-check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.advies-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* ══ 2-COL GRID ══ */
.result-grid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.bied-panel{position:sticky;top:0}

/* ══ CARDS ══ */
.rcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.rcard-head{padding:13px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.rcard-body{padding:14px 16px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.drow:last-child{border-bottom:none}
.dl{color:var(--text2);font-weight:500}
.dv{color:var(--text);font-weight:600;text-align:right}
.dv.g{color:var(--green)}.dv.o{color:var(--orange)}.dv.r{color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;margin-left:6px}
.badge.g{background:rgba(0,230,138,.1);color:var(--green)}
.badge.o{background:rgba(245,166,35,.1);color:var(--orange)}
.badge.r{background:rgba(239,68,68,.1);color:var(--red)}

/* ══ TURNTABLE ══ */
.turntable{position:relative;border-radius:var(--radius-sm);overflow:hidden;background:linear-gradient(180deg,#1a1f2e,#0d1117);border:1px solid var(--border);margin-bottom:14px}
.turntable-track{display:flex;transition:transform .35s cubic-bezier(.25,.46,.45,.94)}
.turntable-slide{min-width:100%;position:relative}
.turntable-slide img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.turntable-label{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:6px}
.turntable-btn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:5;transition:.15s}
.turntable-btn:hover{background:rgba(0,0,0,.8)}
.turntable-prev{left:8px}.turntable-next{right:8px}
.turntable-dots{display:flex;justify-content:center;gap:5px;padding:8px 0 4px}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--text4);cursor:pointer;transition:.2s}
.tdot.active{background:var(--green);transform:scale(1.3)}
.turntable-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-size:11px;color:var(--text3)}
.turntable-loading .mini-spin{width:14px;height:14px;border:2px solid var(--green);border-top-color:transparent;border-radius:50%;animation:sp .6s linear infinite}

/* ══ SCORES ══ */
.score-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.score-row:last-child{border-bottom:none}
.score-lbl{font-size:12px;font-weight:500;color:var(--text2);min-width:85px}
.score-bar{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px;transition:width .4s}
.score-num{font-size:14px;font-weight:700;font-family:var(--mono);min-width:30px;text-align:right}
.barometer{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--red) 0%,var(--orange) 35%,#22c55e 70%,var(--green) 100%);position:relative;margin:10px 0 4px}
.baro-needle{position:absolute;top:-4px;width:4px;height:16px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.5)}
.baro-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}

/* ══ SLIDERS ══ */
.slider-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.slider-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.slider-row{margin-bottom:12px}
.slider-row:last-child{margin-bottom:0}
.slider-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.slider-name{font-size:12px;font-weight:600;color:var(--text2)}
.slider-disp{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--green)}
input[type=range].sl{-webkit-appearance:none;width:100%;height:5px;background:var(--card2);border-radius:3px;outline:none;margin:4px 0}
input[type=range].sl::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--green);cursor:pointer;box-shadow:0 0 6px rgba(0,230,138,.3)}
.slider-ticks{display:flex;justify-content:space-between;font-size:8px;color:var(--text4);font-weight:600}
.seg-select{background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 10px;font-size:12px;width:100%;-webkit-appearance:none}
.btw-toggle{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.btw-opt{padding:5px 12px;font-size:11px;font-weight:600;color:var(--text3);background:var(--card2);transition:.15s}
.btw-opt.active{background:var(--green);color:#000}

/* ══ TOGGLES ══ */
.toggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.toggle-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;user-select:none}
.toggle-item.active{background:var(--green-soft);border-color:var(--green-border)}
.toggle-sw{width:32px;height:18px;border-radius:9px;background:var(--text4);position:relative;transition:.2s;flex-shrink:0}
.toggle-sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text3);transition:.2s}
.toggle-item.active .toggle-sw{background:var(--green)}
.toggle-item.active .toggle-sw::after{transform:translateX(14px);background:#fff}
.toggle-name{font-size:11px;font-weight:600;color:var(--text2)}
.toggle-cost{font-size:10px;font-weight:700;color:var(--orange);font-family:var(--mono)}

/* ══ BOD SECTION ══ */
.bod-card{background:linear-gradient(135deg,#0a1a10,#0a150a);border:1px solid var(--green-border);border-radius:var(--radius);padding:16px;margin-bottom:14px;text-align:center}
.bod-label{font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:1px}
.bod-val{font-size:36px;font-weight:900;font-family:var(--mono);color:var(--green);letter-spacing:-2px;line-height:1.1;margin:4px 0}
.bod-breakdown{font-size:10px;color:var(--text4);line-height:1.5}
.bod-btn{width:100%;padding:13px;border-radius:var(--radius-sm);background:var(--green);border:none;color:#000;font-size:14px;font-weight:700;margin-top:10px;transition:.15s}
.bod-btn:hover{filter:brightness(1.1)}

/* ══ ADVIES BLOCK ══ */
.advies-block{padding:12px 16px;border-radius:10px;margin-bottom:14px}
.advies-block.kopen{background:rgba(0,230,138,.04);border-left:4px solid var(--green)}
.advies-block.bieden{background:rgba(74,158,255,.04);border-left:4px solid var(--blue)}
.advies-block.voorzichtig{background:rgba(245,166,35,.04);border-left:4px solid var(--orange)}
.advies-block.niet{background:rgba(239,68,68,.04);border-left:4px solid var(--red)}
.advies-action{font-size:14px;font-weight:700;margin-bottom:4px}
.advies-line{font-size:12px;color:var(--text2);margin:3px 0;line-height:1.5}
.advies-line.plus{color:var(--green)}.advies-line.warn{color:var(--orange)}

/* ══ ACTIONS ══ */
.action-row{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.action-btn{padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;transition:.15s;display:flex;align-items:center;gap:6px;border:1px solid var(--border2);background:rgba(255,255,255,.03);color:var(--text2)}
.action-btn:hover{border-color:var(--green-border);color:var(--text)}
.action-btn.primary{background:var(--green);border-color:var(--green);color:#000}
.action-btn.blue{background:rgba(74,158,255,.1);border-color:rgba(74,158,255,.25);color:var(--blue)}

/* ══ WARNINGS ══ */
.warns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.warn-tag{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600}
.warn-tag.danger{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);color:var(--red)}
.warn-tag.warning{background:var(--green-soft);border:1px solid var(--green-border);color:var(--green)}
.warn-tag.money{background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.2);color:var(--orange)}

/* ══ LOGIN ══ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:360px;text-align:center}
.login-box input{width:100%;padding:13px 16px;background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:var(--green-border)}
.login-box input::placeholder{color:var(--text4)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

/* ══ TOAST ══ */
.toast-box{position:fixed;top:12px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;backdrop-filter:blur(16px);display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:toastIn .3s ease forwards;opacity:0;transform:translateY(-12px)}
.toast.out{animation:toastOut .25s ease forwards}
.toast.success{background:rgba(0,230,138,.12);border:1px solid rgba(0,230,138,.2);color:var(--green)}
.toast.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);color:var(--red)}
.toast.info{background:rgba(74,158,255,.12);border:1px solid rgba(74,158,255,.2);color:var(--blue)}
.toast.warning{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.2);color:var(--orange)}
@keyframes toastIn{to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px)}}

/* ══ RESPONSIVE ══ */
@media(max-width:1024px){
  .sidebar{display:none}
  .price-row{grid-template-columns:1fr 1fr}
  .pcard.advies{grid-column:span 2}
  .result-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .content{padding:16px}
  .price-row{grid-template-columns:1fr}
  .pcard.advies{grid-column:span 1}
}
</style>
</head>
<body>
<div class="toast-box" id="toasts"></div>

<!-- ══ LOGIN ══ -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <img src="/m/logo-cardatax-large.png" alt="CarDatax" style="height:55px;margin:0 auto 8px">
    <div style="color:var(--text3);font-size:10px;letter-spacing:3px;margin-bottom:28px;text-transform:uppercase">Dealer Platform</div>
    <input id="lu" type="text" placeholder="Gebruikersnaam" autocomplete="username" autofocus>
    <input id="lp" type="password" placeholder="Wachtwoord" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="tax-btn" onclick="doLogin()">Inloggen</button>
    <div class="login-err" id="lErr"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app-screen" class="app" style="display:none">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-logo">
      <img src="/m/logo-cardatax-medium.png" alt="CarDatax">
      <span class="sb-logo-text">Platform</span>
    </div>
    <div class="sb-nav">
      <button class="sb-item active" onclick="showPanel('taxatie')" id="nav-taxatie">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Nieuwe Taxatie
      </button>
      <button class="sb-item" onclick="window.open('/m/#walkaround')" id="nav-scanner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Schade Scanner
      </button>

<script>
// ══════════════════════════════════════
// CARDATAX DESKTOP — /app/
// Uses same API endpoints as /m/
// ══════════════════════════════════════

const _token=()=>localStorage.getItem('t4c_token')||'';
const _authH=()=>({'Content-Type':'application/json','Authorization':'Bearer '+_token()});
// Globale API wrapper — vangt 401 op met re-login popup
async function _api(url, opts={}) {
  if (!opts.headers && url !== '/api/login') opts.headers = _authH();
  const r = await fetch(url, opts);
  if (r.status === 401 && url !== '/api/login' && url !== '/api/me') {
    // Sessie verlopen — toon popup
    if (!document.getElementById('reauth-modal')) {
      const m = document.createElement('div');
      m.id = 'reauth-modal';
      m.innerHTML = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center">' +
        '<div style="background:var(--card,#1a1a2e);border:1px solid var(--border2,#333);border-radius:16px;padding:30px;max-width:340px;width:90%;text-align:center">' +
        '<div style="font-size:24px;margin-bottom:8px">🔒</div>' +
        '<div style="color:var(--text,#fff);font-size:16px;font-weight:600;margin-bottom:6px">Sessie verlopen</div>' +
        '<div style="color:var(--text3,#999);font-size:13px;margin-bottom:20px">Log opnieuw in om verder te gaan</div>' +
        '<input id="reauth-user" placeholder="Gebruikersnaam" style="width:100%;padding:10px 14px;background:var(--bg,#0a0a1a);border:1px solid var(--border2,#333);border-radius:8px;color:var(--text,#fff);font-size:14px;margin-bottom:8px;box-sizing:border-box">' +
        '<input id="reauth-pass" type="password" placeholder="Wachtwoord" style="width:100%;padding:10px 14px;background:var(--bg,#0a0a1a);border:1px solid var(--border2,#333);border-radius:8px;color:var(--text,#fff);font-size:14px;margin-bottom:12px;box-sizing:border-box">' +
        '<div id="reauth-err" style="color:var(--red,#f44);font-size:12px;min-height:18px;margin-bottom:8px"></div>' +
        '<button onclick="doReauth()" style="width:100%;padding:12px;background:var(--green,#00d26a);color:#000;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer">Opnieuw inloggen</button>' +
        '</div></div>';
      document.body.appendChild(m);
      // Pre-fill username
      const stored = JSON.parse(localStorage.getItem('t4c_user')||'{}');
      if (stored.username) document.getElementById('reauth-user').value = stored.username;
      document.getElementById('reauth-pass').focus();
      document.getElementById('reauth-pass').addEventListener('keydown', e => { if(e.key==='Enter') doReauth() });
    }
    throw new Error('SESSION_EXPIRED');
  }
  return r;
}
async function doReauth() {
  const u = document.getElementById('reauth-user').value.trim();
  const p = document.getElementById('reauth-pass').value;
  const err = document.getElementById('reauth-err');
  if (!u || !p) { err.textContent = 'Vul beide velden in'; return; }
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p})});
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('t4c_token', d.token);
      if (d.user) localStorage.setItem('t4c_user', JSON.stringify(d.user));
      user = d.user || d;
      document.getElementById('reauth-modal')?.remove();
      toast('Weer ingelogd!', 'success');
    } else { err.textContent = d.error || 'Ongeldige inloggegevens'; }
  } catch(e) { err.textContent = 'Server niet bereikbaar'; }
}
let user=null, last=null, recent=JSON.parse(localStorage.getItem('t4c_rec')||'[]');

// ── Helpers ──
function E(n){return n!=null?'€'+Number(Math.round(n)).toLocaleString('nl-NL'):'—'}
function N(n){return n!=null?Number(n).toLocaleString('nl-NL'):'—'}
function fmtP(p){
  const s=p.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.length<5||s.length>6)return s;
  const pts=[/^([A-Z]{2})(\d{2})(\d{2})$/,/^(\d{2})(\d{2})([A-Z]{2})$/,/^(\d{2})([A-Z]{2})(\d{2})$/,/^([A-Z]{2})(\d{2})([A-Z]{2})$/,/^([A-Z]{2})([A-Z]{2})(\d{2})$/,/^(\d{2})([A-Z]{2})([A-Z]{2})$/,/^(\d{2})([A-Z]{3})(\d{1})$/,/^(\d{1})([A-Z]{3})(\d{2})$/,/^([A-Z]{2})(\d{3})([A-Z]{1})$/,/^([A-Z]{1})(\d{3})([A-Z]{2})$/,/^([A-Z]{3})(\d{2})([A-Z]{1})$/,/^([A-Z]{1})(\d{2})([A-Z]{3})$/,/^(\d{1})([A-Z]{2})(\d{3})$/,/^(\d{3})([A-Z]{2})(\d{1})$/];
  for(const r of pts){const m=s.match(r);if(m)return m[1]+'-'+m[2]+'-'+m[3]}
  return s.length===6?s.slice(0,3)+'-'+s.slice(3,5)+'-'+s.slice(5):s.slice(0,2)+'-'+s.slice(2,4)+'-'+s.slice(4);
}
function toast(msg,type='info',dur=3000){
  const c=document.getElementById('toasts'),t=document.createElement('div');
  t.className='toast '+type;t.textContent=msg;c.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},dur);
}
function scClr(s){return s>=7?'var(--green)':s>=5?'var(--orange)':'var(--red)'}

// ── Auth ──
async function doLogin(){
  const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value,err=document.getElementById('lErr');
  err.textContent='';if(!u||!p){err.textContent='Vul beide velden in';return}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.token){localStorage.setItem('t4c_token',d.token);if(d.user)localStorage.setItem('t4c_user',JSON.stringify(d.user));user=d.user||d;initApp()}
    else err.textContent=d.error||'Ongeldige inloggegevens';
  }catch(e){err.textContent='Server niet bereikbaar'}
}
function doLogout(){localStorage.removeItem('t4c_token');localStorage.removeItem('t4c_user');location.reload()}
async function checkAuth(){
  if(!_token())return false;
  try{const r=await fetch('/api/me',{headers:_authH()});const d=await r.json();if(d.ok){user=d;return true}}catch{}
  return false;
}
async function initApp(){
  if(await checkAuth()){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='flex';
    document.getElementById('tb-user').textContent=user.name||user.username||'';
    renderSidebar();renderChips();
  }
}

// ── Sidebar ──
function renderSidebar(){
  const el=document.getElementById('sb-list');
  if(!recent.length){el.innerHTML='<div style="text-align:center;padding:20px;color:var(--text4);font-size:12px">Nog geen taxaties</div>';return}
  el.innerHTML=recent.slice(0,20).map((r,i)=>`<div class="sb-entry" onclick="reloadTax('${r.plate}')"><div class="sb-plate">${fmtP(r.plate)}</div><div class="sb-car">${r.make||''} ${r.model||''} · ${r.year||''}</div>${r.bod?'<div class="sb-price">'+E(r.bod)+'</div>':''}</div>`).join('');
}
function renderChips(){
  const el=document.getElementById('recent-chips');
  if(!recent.length){el.innerHTML='';return}
  el.innerHTML=recent.slice(0,5).map(r=>`<button class="recent-chip" onclick="document.getElementById('mp').value='${r.plate.replace(/-/g,'')}';document.getElementById('mp').dispatchEvent(new Event('input'))">${fmtP(r.plate)}</button>`).join('');
}
function reloadTax(plate){
  document.getElementById('mp').value=plate.replace(/-/g,'');
  document.getElementById('mp').dispatchEvent(new Event('input'));
  showPanel('taxatie');
}

// ── Panels ──
function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('p-'+id)?.classList.add('active');
  const titles={taxatie:'Nieuwe Taxatie',loading:'Bezig...',result:'Taxatie Resultaat'};
  document.getElementById('tb-title').textContent=titles[id]||id;
}
function ldStep(n){for(let i=1;i<=4;i++){const el=document.getElementById('ls'+i);if(!el)continue;el.className=i<n?'ld-step done':i===n?'ld-step active':'ld-step'}}

// ══════════════════════════════════════
// PRICING FORMULA (exact copy from taxatie.js)
// ══════════════════════════════════════
function detectSegment(v){
  const mk=(v.make||'').toLowerCase(),ml=(v.model||'').toLowerCase(),fl=(v.fuel||'').toLowerCase(),sub=(v.subModel||'').toLowerCase(),body=(v.body||'').toLowerCase();
  if(['transporter','caddy','crafter','sprinter','transit','vivaro','trafic','expert','jumpy','boxer','ducato','daily','master','movano','berlingo','partner','kangoo','combo','nv200','proace','hiace','vito','citan','courier'].some(s=>ml.includes(s)))return 'lcv';
  if(body.includes('bedrijfs')||body.includes('bestel'))return 'lcv';
  if(fl.includes('elektr')||fl.includes('electric'))return 'ev';
  if(['porsche','jaguar','land rover','maserati','bentley','ferrari','lamborghini','aston martin'].some(s=>mk.includes(s)))return 'sport';
  if(['bmw','audi','mercedes','lexus','volvo','infiniti','alfa romeo','mini','ds'].some(s=>mk.includes(s)))return 'premium';
  if(['gti','rs','amg','cupra','nismo','type r'].some(s=>sub.includes(s)))return 'sport';
  if(['dacia','suzuki','mg','lada','ssangyong'].some(s=>mk.includes(s)))return 'budget';
  return 'midden';
}
function staffelMarge(vp,seg){
  const m={budget:0.12,midden:0.10,premium:0.08,ev:0.09,lcv:0.09,sport:0.14};
  if(seg&&m[seg]!==undefined)return m[seg];
  if(vp<7500)return 0.13;if(vp<12500)return 0.12;if(vp<20000)return 0.10;if(vp<35000)return 0.09;return 0.08;
}
function courantBonusPct(s){return[0,0,0,0.5,1,1.5,2,2.5,3,3.5,4][Math.min(10,Math.max(0,s))]||0}
function risicoCorrectie(s){return[0,0,150,250,350,500,650,850,1100,1400,1800][Math.min(10,Math.max(0,s))]||0}
function staatKosten(s){return[0,1200,900,700,550,400,300,200,100,0,0][Math.min(10,Math.max(0,s))]||0}
function seizoenPct(s){return{neutraal:0,cabrio_winter:-0.03,cabrio_zomer:0.03,suv_winter:0.02,diesel_stad:-0.02,schaars:0.02,overstock:-0.02}[s]||0}
const maintCosts={distributie:750,banden:300,remmen:250,beurt:400,ruit:200,velgen:150,interieur:250};

function recalcBod(){
  const c=window._t4c;if(!c)return{bod:0,marge:0,margePct:0,margePctUsed:0,rkTotal:0,risicoCor:0,onderhoud:0,courantBonus:0};
  const vp=c.vp,seg=c.segment||'midden';
  let margePct=c.overrides.marge!==null&&c.overrides.marge>0?c.overrides.marge/100:staffelMarge(vp,seg);
  if(c.verkoopType==='export')margePct+=0.03;
  const rkBase=c.overrides.rkBasis!==null&&c.overrides.rkBasis>=0?c.overrides.rkBasis:250;
  const rkExtra=staatKosten(c.staat);const rc=risicoCorrectie(c.risico);
  let or=0;Object.keys(c.toggles).forEach(k=>{if(c.toggles[k])or+=maintCosts[k]||0});
  let seizPct=c.overrides.seizoenPct!==null&&c.overrides.seizoenPct!==0?c.overrides.seizoenPct/100:seizoenPct(c.seizoen||'neutraal');
  const courantPct=courantBonusPct(c.courant)/100;
  let btwBonus=c.overrides.btwBonus!==null&&c.overrides.btwBonus>=0?c.overrides.btwBonus:c.btwAuto?Math.round(vp*0.02):0;
  const bpmCor=c.overrides.bpmCorrectie||0;
  let bod=vp-(vp*margePct)-(rkBase+rkExtra)-rc-or+(vp*seizPct)+(vp*courantPct)+btwBonus-bpmCor;
  bod=Math.round(Math.max(bod,500));
  // ═══ LAAG 3: Server pricing als basis ═══
  const _l3=c.r?.pricingL3;
  if(_l3&&_l3.source!=='no_data'&&_l3.inkoopHigh>0){
    // Server L3 bepaalt de basis, frontend sliders zijn correcties
    bod=_l3.inkoopHigh;
  } else {
    // Fallback: clamp op server inkoop range
    const _il=c.r?.inkoopLow||0,_ih=c.r?.inkoopHigh||0;
    if(_il>0&&_ih>0){bod=Math.min(bod,_ih);bod=Math.max(bod,_il);}
  }
  const marge=vp-bod;
  return{bod,marge,margePct:vp>0?Math.round(marge/vp*100):0,margePctUsed:Math.round(margePct*100),rkTotal:rkBase+rkExtra,risicoCor:rc,onderhoud:or,courantBonus:Math.round(vp*courantPct),btwBonus,bpmCor};
}

// ══════════════════════════════════════
// TAXATIE FLOW
// ══════════════════════════════════════
async function doTax(){
  const errEl=document.getElementById('tax-error'),btn=document.getElementById('tax-btn');
  errEl.textContent='';
  const p=document.getElementById('mp').value.replace(/[^a-zA-Z0-9]/g,'').toUpperCase();
  const km=document.getElementById('mk').value.replace(/[^0-9]/g,'');
  if(!p||p.length<5){errEl.textContent='Voer een geldig kenteken in';return}
  showPanel('loading');ldStep(1);btn.disabled=true;btn.textContent='Bezig...';
  try{
    const vR=await fetch('/api/vehicle/enriched?plate='+p+(km?'&km='+km:''));
    if(!vR.ok)throw new Error('Server fout ('+vR.status+')');
    const v=await vR.json();if(v.error)throw new Error(v.error);if(!v?.make)throw new Error('Kenteken niet gevonden bij RDW');
    ldStep(2);
    const[mR,pR]=await Promise.allSettled([
      fetch('/api/market?make='+encodeURIComponent(v.make)+'&model='+encodeURIComponent(v.model)+'&year='+v.year+'&km='+(km||0)+'&sub='+encodeURIComponent(v.subModel||'')+'&body='+encodeURIComponent(v.body||'')+'&fuel='+encodeURIComponent(v.fuel||'')+'&transmission='+encodeURIComponent(v.transmissionAuto?'automaat':'')).then(r=>r.json()),
      fetch('/api/dealer/price',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plate:fmtP(p),make:v.make,model:v.model,year:v.year,km:Number(km)||v.km||0,fuel:v.fuel,weightKg:v.weightKg,catalogPrice:v.catalogPrice,bpm:v.bpm,power:v.powerKw,ownerCount:v.ownerCount||0,isExDealer:v.isExDealer||false,bpmRest:v.bpmRest||0,importFlag:v.importFlag,stolenFlag:v.stolenFlag,transmissionAuto:v.transmissionAuto,transmissionType:v.transmissionType,transmissionDetail:v.transmissionDetail,engineLabel:v.engineLabel,subModel:v.subModel,vin:v.vin,motorCode:v.motorCode,generation:v.generation,trimLevel:v.trimLevel,drivetrain:v.drivetrain,engineRiskProfile:v.engineRiskProfile,courantScore:v.courantScore,optionPriceImpact:v.optionPriceImpact})}).then(r=>r.json())
    ]);
    const m=mR.status==='fulfilled'?mR.value:null;
    const r=pR.status==='fulfilled'?pR.value:null;
    if(!r||r.error)throw new Error(r?.error||'Prijsberekening mislukt');
    ldStep(4);
    last={v,m,r,plate:fmtP(p),km:Number(km)||0};
    // Save to recent
    recent=recent.filter(x=>x.plate!==last.plate);
    recent.unshift({plate:fmtP(p),make:v.make,model:v.model,year:v.year,bod:r.handelswaarde||r.t4cBod||0,ts:Date.now()});
    if(recent.length>20)recent=recent.slice(0,20);
    try{localStorage.setItem('t4c_rec',JSON.stringify(recent))}catch{}
    // Auto-save
    fetch('/api/taxatie/save',{method:'POST',headers:_authH(),body:JSON.stringify({kenteken:last.plate,make:v.make,model:v.model,year:v.year,fuel:v.fuel,km:last.km,power_kw:v.powerKw,power_hp:v.powerHp,engine_label:v.engineLabel,verkoopadviees:r.verkoopadviees,handelswaarde:r.handelswaarde,inkoop_low:r.inkoopLow,inkoop_high:r.inkoopHigh,internet_prijs:r.internetPrijs,market_count:m?.count,p25:m?.p25,p50:m?.median,p75:m?.p75,status:'concept'})}).catch(()=>{});
    renderResult();showPanel('result');renderSidebar();
    // Background: images
    generateCarImages();
  }catch(e){
    showPanel('taxatie');errEl.textContent=e.message;
  }
  btn.disabled=false;btn.textContent='Taxeer voertuig';
}

// ══════════════════════════════════════
// RENDER RESULT
// ══════════════════════════════════════
function renderResult(){
  if(!last)return;
  const{v,m,r,plate,km}=last;
  const vp=r.verkoopadviees||r.internetPrijs||0;
  const hw=r.handelswaarde||Math.round(vp*.88)||0;
  const _sc=r.scores||{};
  const courantScore=_sc.courant?.score||5,vergelijkScore=_sc.vergelijk?.score||5,techniekScore=_sc.techniek?.score||5,margeScore=_sc.marge?.score||5;
  const initCourant=Math.min(10,Math.max(1,Math.round(courantScore)));
  const engL=(v.engineLabel||'').toLowerCase(),motC=(v.motorCode||'').toLowerCase(),transD=(v.transmissionDetail||'').toLowerCase();
  const isRiskyEngine=['thp','ecoboost','dsg','tce','puretech','tsi','tfsi','n47','n57','ep6','prince'].some(k=>engL.includes(k)||motC.includes(k)||transD.includes(k));
  let initRisico=v.engineRiskProfile==='Hoog'?Math.max(7,Math.round(r.riskScore/10)):Math.round(r.riskScore/12)||3;
  if(isRiskyEngine)initRisico=Math.max(6,initRisico);
  initRisico=Math.min(10,Math.max(1,initRisico));
  const detectedSeg=detectSegment(v);

// ── Slider handlers ──
function onSlider(){
  const c=window._t4c;if(!c)return;
  c.courant=parseInt(document.getElementById('sl-c').value);
  c.risico=parseInt(document.getElementById('sl-r').value);
  c.staat=parseInt(document.getElementById('sl-s').value);
  c.segment=document.getElementById('sl-seg').value;
  document.getElementById('sl-c-d').textContent=c.courant+'/10 → +'+courantBonusPct(c.courant)+'%';
  document.getElementById('sl-r-d').textContent=c.risico+'/10 → -'+E(risicoCorrectie(c.risico));
  document.getElementById('sl-s-d').textContent=c.staat+'/10 → -'+E(staatKosten(c.staat));
  updateLive();
}
function toggleMaint(el,key){const c=window._t4c;if(!c)return;c.toggles[key]=!c.toggles[key];el.classList.toggle('active',c.toggles[key]);updateLive()}
function setBtw(b){const c=window._t4c;if(!c)return;c.btwAuto=b;document.getElementById('btw-m').classList.toggle('active',!b);document.getElementById('btw-b').classList.toggle('active',b);updateLive()}
function setVT(t){const c=window._t4c;if(!c)return;c.verkoopType=t;document.getElementById('vt-nl').classList.toggle('active',t==='nl');document.getElementById('vt-ex').classList.toggle('active',t==='export');updateLive()}
function updateLive(){
  const calc=recalcBod();
  const c=window._t4c;if(!c)return;
  const els={bod:document.getElementById('live-bod'),pcBod:document.getElementById('pc-bod'),pcMarge:document.getElementById('pc-marge'),pcMargePct:document.getElementById('pc-margepct'),ond:document.getElementById('live-ond'),bk:document.getElementById('live-breakdown')};
  if(els.bod)els.bod.textContent=E(calc.bod);
  if(els.pcBod)els.pcBod.textContent=E(calc.bod);
  if(els.pcMarge){els.pcMarge.textContent=E(calc.marge);els.pcMarge.style.color=calc.marge>2000?'var(--green)':'var(--orange)'}
  if(els.pcMargePct)els.pcMargePct.textContent=calc.margePct+'%';
  if(els.ond)els.ond.textContent='€ '+calc.onderhoud.toLocaleString('nl-NL');
  if(els.bk){let t='VP '+E(c.vp)+' - marge '+calc.margePctUsed+'% - RK €'+calc.rkTotal+' - risico €'+calc.risicoCor+' - onderhoud €'+calc.onderhoud;if(calc.courantBonus>0)t+=' + bonus €'+calc.courantBonus;els.bk.textContent=t}
}

// ── Turntable ──
let ttIdx=0,ttImgs=[];
function ttNav(dir){if(!ttImgs.length)return;ttIdx=((ttIdx+dir)%ttImgs.length+ttImgs.length)%ttImgs.length;document.getElementById('tt-track').style.transform='translateX(-'+ttIdx*100+'%)';document.querySelectorAll('.tdot').forEach((d,i)=>d.classList.toggle('active',i===ttIdx))}
async function generateCarImages(){
  if(!last)return;const{v,plate}=last;const pc=plate.replace(/[^A-Z0-9]/gi,'').toUpperCase();if(!pc)return;
  const ld=document.getElementById('tt-loading');
  try{
    const cR=await fetch('/api/car-images/'+pc);const cache=await cR.json();
    if(cache.ok&&cache.images?.length>=4){if(ld)ld.style.display='none';buildTT(cache.images);return}
    if(ld)ld.style.display='flex';
    const gR=await _api('/api/generate-car-images',{method:'POST',headers:{'Content-Type':'application/json',..._authH()},body:JSON.stringify({make:v.make,model:v.model,year:v.year,color:v.color,body:v.body,plate:plate,variant:v.modelVariant||'',generation:v.generation||'',subModel:v.subModel||'',trimLevel:v.trimLevel||''})});
    const gen=await gR.json();if(ld)ld.style.display='none';
    if(gen.images?.length)buildTT(gen.images.filter(i=>i.url));
  }catch(e){if(ld)ld.style.display='none'}
}
function buildTT(images){
  ttImgs=images;ttIdx=0;
  const labels={'1-front':'Voorkant','2-right':'Rechterzijde','3-rear':'Achterkant','4-left':'Linkerzijde'};
  const order=['1-front','2-right','3-rear','4-left'];
  const sorted=order.map(a=>images.find(i=>i.angle===a)).filter(Boolean);
  const imgs=sorted.length>=3?sorted:images;
  ttImgs=imgs;
  const track=document.getElementById('tt-track');
  const dots=document.getElementById('tt-dots');
  track.innerHTML=imgs.map(img=>'<div class="turntable-slide"><img src="'+img.url+'?t='+Date.now()+'" alt=""><div class="turntable-label">'+(labels[img.angle]||img.angle||'')+'</div></div>').join('');
  dots.innerHTML=imgs.map((_,i)=>'<span class="tdot'+(i===0?' active':'')+'" onclick="ttGo('+i+')"></span>').join('');
  // Touch swipe
  let sx=0,dx=0,sw=false;
  track.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;sw=true;track.style.transition='none'},{passive:true});
  track.addEventListener('touchmove',e=>{if(!sw)return;dx=e.touches[0].clientX-sx;track.style.transform='translateX('+((-ttIdx*100)+(dx/track.parentElement.offsetWidth)*100)+'%)'},{passive:true});
  track.addEventListener('touchend',()=>{if(!sw)return;sw=false;track.style.transition='transform .35s cubic-bezier(.25,.46,.45,.94)';if(Math.abs(dx)>40)ttNav(dx<0?1:-1);else ttNav(0)});
}
function ttGo(i){ttIdx=i;document.getElementById('tt-track').style.transform='translateX(-'+i*100+'%)';document.querySelectorAll('.tdot').forEach((d,j)=>d.classList.toggle('active',j===i))}

// ── Copy & PDF ──
function sendFeedback(){
  const inp=document.getElementById('eigen-bod');const msg=document.getElementById('feedback-msg');
  const bod=parseInt(inp.value.replace(/[^0-9]/g,''),10);
  if(!bod||bod<100){msg.textContent='Vul een geldig bedrag in';msg.style.color='var(--orange)';return}
  if(!last||!last.r)return;
  const data={kenteken:last.plate,make:last.v.make,model:last.v.model,year:last.v.year,km:last.km,
    segment:window._t4c?.segment||'midden',onze_inkoop_high:last.r.inkoopHigh||0,onze_verkoop:0,
    eigen_bod:bod,status:'gekocht'};
  fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(r=>r.json()).then(d=>{
      if(d.ok){
        msg.style.color='var(--green)';
        msg.textContent='Opgeslagen!'+(d.correction!==null?' Correctie: '+d.correction+'% ('+d.feedbackCount+' feedbacks)':' '+d.message);
        inp.value='';inp.style.borderColor='var(--green)';setTimeout(()=>{inp.style.borderColor=''},2000)
      } else { msg.textContent=d.error||'Fout';msg.style.color='var(--red)' }
    }).catch(e=>{msg.textContent='Fout: '+e.message;msg.style.color='var(--red)'})
}
function copyBod(){
  const c=window._t4c;if(!c)return;
  const bod=document.getElementById('live-bod')?.textContent||'';
  const txt=c.v.make+' '+c.v.model+' '+c.v.year+'\nKenteken: '+c.plate+'\nBod: '+bod+'\nRetail: '+E(c.vp)+'\nMarge: '+E(c.vp-recalcBod().bod);
  navigator.clipboard?.writeText(txt).then(()=>toast('Bod gekopieerd','success')).catch(()=>toast('Kopiëren mislukt','error'));
}
async function exportPdf(){
  if(!last)return;toast('PDF genereren...','info',2000);
  const calc=recalcBod(),c=window._t4c||{};
  try{
    const r=await _api('/api/pdf',{method:'POST',headers:_authH(),body:JSON.stringify({vehicle:{make:last.v.make,model:last.v.model,year:last.v.year,fuel:last.v.fuel,plate:last.plate,body:last.v.body||'',powerHp:last.v.powerHp,powerKw:last.v.powerKw,transmissionType:last.v.transmissionType||'',engineLabel:last.v.engineLabel||'',subModel:last.v.subModel||'',trimLevel:last.v.trimLevel||'',vin:last.v.vin||'',motorCode:last.v.motorCode||'',catalogPrice:last.v.catalogPrice,bpm:last.v.bpm,bpmRest:last.v.bpmRest||0,ownerCount:last.v.ownerCount||0,apkUntil:last.v.apkUntil||'',engineRiskProfile:last.v.engineRiskProfile||'',napOk:last.v.napOk,importFlag:last.v.importFlag,stolenFlag:last.v.stolenFlag,co2:last.v.co2,emissieKlasse:last.v.emissieKlasse,mrb:last.v.mrb},result:{verkoopadviees:last.r.verkoopadviees,handelswaarde:last.r.handelswaarde,inkoopLow:last.r.inkoopLow,inkoopHigh:last.r.inkoopHigh,internetPrijs:last.r.internetPrijs,t4cBod:calc.bod,confidence:last.r.confidence||0,smartSummary:last.r.smartSummary||[]},market:{count:last.m?.count||0,avg:last.m?.avg||0,median:last.m?.median||0,p25:last.m?.p25||0,p75:last.m?.p75||0},km:last.km,bod:calc.bod,atr:last.r.verkoopadviees||last.r.internetPrijs,etr:last.r.handelswaarde,marge:calc.marge,margePct:calc.margePct,breakdown:'VP '+E(c.vp)+' - marge '+calc.margePctUsed+'%'})});
    if(!r.ok)throw new Error('PDF fout');
    const blob=await r.blob();const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='taxatie-'+last.plate+'.pdf';a.click();URL.revokeObjectURL(url);
    toast('PDF gedownload','success');
  }catch(e){toast('PDF mislukt: '+e.message,'error')}
}

document.getElementById('mk')?.addEventListener('input',function(){const v=this.value.replace(/[^0-9]/g,'');this.value=v?Number(v).toLocaleString('nl-NL'):''});

// ── Boot ──
initApp();
