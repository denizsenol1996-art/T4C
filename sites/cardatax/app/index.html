<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060810">
<title>CarDatax — Taxatie Platform</title>
<link rel="icon" href="/app/favicon-32.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#060810;--bg2:#0a0e18;--surface:#0f1420;--surface2:#141a28;--surface3:#1a2134;--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.10);--border-accent:rgba(34,214,138,.25);--accent:#22d68a;--accent2:#1abc78;--accent-dim:rgba(34,214,138,.10);--accent-glow:rgba(34,214,138,.06);--red:#ff5268;--red-dim:rgba(255,82,104,.10);--orange:#ffb340;--orange-dim:rgba(255,179,64,.10);--blue:#5ba0ff;--text:#e8ecf4;--text2:#8892a8;--text3:#505a70;--text4:#343a4a;--shadow:0 4px 24px rgba(0,0,0,.5);--glow:0 0 40px rgba(34,214,138,.08);--radius:14px;--radius-sm:10px;--radius-xs:8px;--mono:'JetBrains Mono',ui-monospace,monospace;--font:'Inter',system-ui,-apple-system,sans-serif}
[data-theme="light"]{--bg:#f5f7fa;--bg2:#fff;--surface:#fff;--surface2:#f8f9fc;--surface3:#f0f2f5;--border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);--border-accent:rgba(22,166,104,.3);--accent:#16a668;--accent2:#139c5e;--accent-dim:rgba(22,166,104,.08);--accent-glow:rgba(22,166,104,.04);--red:#e83850;--red-dim:rgba(232,56,80,.08);--orange:#d49500;--orange-dim:rgba(212,149,0,.08);--blue:#2b7fff;--text:#1a1e2a;--text2:#5c6478;--text3:#9ca3b4;--text4:#c4c9d4;--shadow:0 4px 24px rgba(0,0,0,.04);--glow:none}
*{margin:0;padding:0;box-sizing:border-box}html{height:100%}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}input,select,textarea,button{font-family:inherit}.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 50% 30%,rgba(34,214,138,.04) 0%,transparent 60%)}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;text-align:center;box-shadow:var(--shadow),var(--glow)}
.login-box img{height:48px;margin-bottom:8px}.login-box .sub{color:var(--text3);font-size:13px;margin-bottom:32px;letter-spacing:.5px}
.login-box input{width:100%;padding:13px 16px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;margin-bottom:12px;outline:none;transition:.2s}
.login-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.login-box button{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.login-box button:hover{filter:brightness(1.1);transform:translateY(-1px)}.login-box button:active{transform:translateY(0)}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px}
.app{display:none;height:100vh;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar-logo{height:26px;cursor:pointer;opacity:.9;transition:.15s}.topbar-logo:hover{opacity:1}
.topbar-role{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--accent-dim);color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.topbar-spacer{flex:1}
.tb{background:none;border:1px solid var(--border);border-radius:var(--radius-xs);color:var(--text2);padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.tb:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}.tb.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.topbar-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.content{height:calc(100vh - 56px);overflow-y:auto;padding:28px 32px 60px}.content-inner{max-width:1200px;margin:0 auto}
.tax-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.plate-wrap{display:flex;align-items:center;background:#f5c518;border-radius:var(--radius-xs);overflow:hidden;height:48px;box-shadow:0 2px 8px rgba(245,197,24,.2)}
.plate-nl{background:#003082;color:#fff;font-size:10px;font-weight:700;padding:0 8px;height:100%;display:flex;align-items:center;letter-spacing:.5px}
.plate-input{background:transparent;border:none;color:#1a1a1a;font-family:var(--mono);font-size:20px;font-weight:700;padding:0 14px;width:180px;text-transform:uppercase;outline:none;letter-spacing:2px}.plate-input::placeholder{color:rgba(26,26,26,.35)}
.km-wrap{position:relative}.km-input{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xs);padding:0 40px 0 14px;height:48px;font-size:15px;color:var(--text);width:160px;outline:none;transition:.2s;font-family:var(--mono)}.km-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}.km-unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.btn-tax{height:48px;padding:0 28px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-xs);font-size:15px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap;letter-spacing:-.3px}.btn-tax:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 16px rgba(34,214,138,.25)}.btn-tax:active{transform:translateY(0)}.btn-tax:disabled{opacity:.5;pointer-events:none}
.loading{text-align:center;padding:80px 20px;color:var(--text2)}.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.load-step{font-size:13px;margin-top:8px;color:var(--text3)}
.err-msg{background:var(--red-dim);border:1px solid rgba(255,82,104,.2);border-radius:var(--radius-sm);padding:14px 18px;color:var(--red);font-size:14px;margin-bottom:16px}
.veh-head{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}.veh-img{width:200px;height:130px;border-radius:var(--radius);overflow:hidden;background:var(--surface);flex-shrink:0;border:1px solid var(--border)}.veh-img img{width:100%;height:100%;object-fit:cover}.veh-name{font-size:24px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px}.veh-variant{font-size:14px;color:var(--accent);margin-bottom:10px;font-weight:500}.veh-badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}.badge.warn{background:var(--orange-dim);color:var(--orange);border-color:rgba(255,179,64,.2)}.badge.danger{background:var(--red-dim);color:var(--red);border-color:rgba(255,82,104,.2)}.badge.good{background:var(--accent-dim);color:var(--accent);border-color:var(--border-accent)}
.price-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--glow)}.pc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.pc-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:600}.pc-bod{font-size:34px;font-weight:800;color:var(--accent);font-family:var(--mono);letter-spacing:-1.5px}.pc-score{font-size:28px;font-weight:700;font-family:var(--mono)}
.pc-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}.pc-metric{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px 8px;text-align:center;transition:.15s}.pc-metric:hover{border-color:var(--border2)}.pc-metric-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;font-weight:600}.pc-metric-val{font-size:18px;font-weight:700;font-family:var(--mono)}
.profit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.profit-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xs);padding:12px 14px;text-align:center}.profit-box.hl{border-color:var(--border-accent);background:var(--accent-glow)}.profit-label{font-size:9px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;font-weight:500}.profit-val{font-size:15px;font-weight:700;font-family:var(--mono)}
.warns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.warn-tag{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-xs);font-size:12px;font-weight:600}.warn-tag.yellow{background:var(--orange-dim);color:var(--orange)}.warn-tag.red{background:var(--red-dim);color:var(--red)}
.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:16px}.sum-title{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent)}.sum-text{font-size:13px;color:var(--text2);line-height:1.6}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sec-head h2{font-size:16px;font-weight:700;letter-spacing:-.3px}.sec-head .sub{font-size:12px;color:var(--text3)}
.mk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.mk-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center}.mk-box.hl{border-color:var(--border-accent);background:var(--accent-dim)}.mk-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;margin-bottom:4px;font-weight:500}.mk-val{font-size:18px;font-weight:700;font-family:var(--mono)}.mk-box.hl .mk-val{color:var(--accent)}
.pt .pt-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}.pt .pt-row:last-child{border:none}.pt .pt-row.hl{background:var(--accent-dim);margin:0 -22px;padding:12px 22px;border:none;font-weight:700;border-radius:var(--radius-xs)}.pt .pt-row.hl span:last-child{color:var(--accent)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:0}.dg-row{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--border)}.dg-row:nth-child(odd){background:rgba(255,255,255,.015)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}.col-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}.kv-l{color:var(--text2)}.kv-v{font-weight:500}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.qg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px}.qg-l{color:var(--text2)}.qg-v{font-weight:600;font-family:var(--mono);font-size:12px}
.act-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.act-btn{padding:12px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;border:none}.act-btn:hover{transform:translateY(-1px)}.act-btn:active{transform:translateY(0)}.act-btn.primary{background:var(--accent);color:#000}.act-btn.primary:hover{filter:brightness(1.1)}.act-btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.act-btn.sec:hover{border-color:var(--accent);color:var(--accent)}.act-btn.highlight{background:linear-gradient(135deg,var(--accent),var(--blue));color:#000;font-weight:700}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:.15s}.stat:hover{border-color:var(--border2)}.stat-val{font-size:24px;font-weight:700;font-family:var(--mono);margin-bottom:2px;letter-spacing:-.5px}.stat-lbl{font-size:12px;color:var(--text2)}
.rec-item{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:.12s;border-bottom:1px solid var(--border)}.rec-item:hover{background:var(--surface2)}.rec-item:active{background:var(--accent-dim)}.rec-plate{font-family:var(--mono);font-weight:700;font-size:14px;min-width:100px;color:var(--accent)}.rec-car{flex:1;font-size:13px;color:var(--text2)}.rec-price{font-family:var(--mono);font-weight:600;color:var(--text);font-size:14px}
.page{display:none}.page.active{display:block}
.toast{position:fixed;top:70px;right:20px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(-10px);transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.toast.ok{background:var(--accent);color:#000}.toast.err{background:var(--red);color:#fff}
@media(max-width:768px){.content{padding:16px}.pc-metrics,.cols{grid-template-columns:1fr 1fr}.profit-grid,.mk-row,.stats-row{grid-template-columns:repeat(2,1fr)}.plate-input{width:130px;font-size:16px}.qgrid{grid-template-columns:repeat(2,1fr)}.dg{grid-template-columns:1fr}.topbar{padding:0 12px;gap:8px}.tax-bar{gap:8px}}
</style>
</head>
<body>
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <img src="/logo-cardatax.png" alt="CarDatax">
    <div class="sub">Professioneel Taxatie Platform</div>
    <input id="loginUser" placeholder="Gebruikersnaam" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <input id="loginPass" type="password" placeholder="Wachtwoord" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Inloggen</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div class="app" id="app">
  <div class="topbar">
    <img src="/logo-cardatax.png" class="topbar-logo" onclick="nav('dashboard')" alt="CarDatax">
    <span class="topbar-role" id="tbRole"></span>
    <div class="topbar-spacer"></div>
    <button class="tb" id="navDash" onclick="nav('dashboard')">Dashboard</button>
    <button class="tb" id="navTax" onclick="nav('taxatie')">Nieuwe Taxatie</button>
    <button class="tb" id="btnAdmin" style="display:none" onclick="window.open('/admin/','_blank')">Admin</button>
    <div class="topbar-user">
      <span id="tbUser" style="font-weight:500"></span>
      <button class="tb" onclick="toggleTheme()" title="Wissel thema">◑</button>
      <button class="tb" onclick="doLogout()" style="color:var(--red);border-color:rgba(255,82,104,.3)">Uit</button>
    </div>
  </div>
  <div class="content"><div class="content-inner">
    <div class="page active" id="pg-dashboard">
      <div style="font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px" id="greeting"></div>
      <div style="color:var(--text3);font-size:14px;margin-bottom:28px">CarDatax Taxatie Platform · v10.7.0</div>
      <div class="tax-bar">
        <div class="plate-wrap"><div class="plate-nl">NL</div><input class="plate-input" id="dPlate" placeholder="XX-999-X" maxlength="9" oninput="this.value=fmtP(this.value)" onkeydown="if(event.key==='Enter')document.getElementById('dKm').focus()"></div>
        <div class="km-wrap"><input class="km-input" id="dKm" placeholder="KM stand" onkeydown="if(event.key==='Enter')dashTax()"><span class="km-unit">km</span></div>
        <button class="btn-tax" onclick="dashTax()">Taxeer</button>
      </div>
      <div class="stats-row" id="dashStats"></div>
      <div class="sec"><div class="sec-head"><h2>Recente Taxaties</h2><span class="sub" id="recCount"></span></div><div id="recentList"></div></div>
    </div>
    <div class="page" id="pg-taxatie">
      <div class="tax-bar">
        <div class="plate-wrap"><div class="plate-nl">NL</div><input class="plate-input" id="plate" placeholder="XX-999-X" maxlength="9" oninput="this.value=fmtP(this.value)" onkeydown="if(event.key==='Enter')document.getElementById('km').focus()"></div>
        <div class="km-wrap"><input class="km-input" id="km" placeholder="KM stand" onkeydown="if(event.key==='Enter')doTax()"><span class="km-unit">km</span></div>
        <button class="btn-tax" id="btnTax" onclick="doTax()">Taxeer</button>
      </div>
      <div id="taxError"></div><div id="taxLoading" style="display:none"></div><div id="taxResult"></div>
    </div>
  </div></div>
</div>
<div class="toast" id="toast"></div>
<div id="deskModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)">
  <div style="background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow)">
    <div id="deskModalTitle" style="font-size:16px;font-weight:700;margin-bottom:16px"></div>
    <input id="deskModalInput" style="width:100%;padding:13px 16px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;box-sizing:border-box" onkeydown="if(event.key==='Enter')document.getElementById('deskModalOk').click();if(event.key==='Escape')closeDeskModal()">
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="act-btn sec" onclick="closeDeskModal()" style="flex:1">Annuleer</button>
      <button class="act-btn primary" id="deskModalOk" style="flex:1">OK</button>
    </div>
  </div>
</div>
<script>
const API=location.origin;let TOKEN=localStorage.getItem('t4c_token')||'',USER={},LAST=null;
const E=n=>{if(!n||!Number.isFinite(n))return'—';return'€\u00A0'+new Intl.NumberFormat('nl-NL',{maximumFractionDigits:0}).format(n)};
const N=n=>n?new Intl.NumberFormat('nl-NL').format(n):'—';
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function fmtP(v){const c=v.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,6);if(c.length!==6)return c;const rx=[/^([A-Z]{2})(\d{2})(\d{2})$/,/^(\d{2})(\d{2})([A-Z]{2})$/,/^(\d{2})([A-Z]{2})(\d{2})$/,/^([A-Z]{2})(\d{2})([A-Z]{2})$/,/^([A-Z]{2})([A-Z]{2})(\d{2})$/,/^(\d{2})([A-Z]{2})([A-Z]{2})$/,/^(\d{2})([A-Z]{3})(\d{1})$/,/^(\d{1})([A-Z]{3})(\d{2})$/,/^([A-Z]{2})(\d{3})([A-Z]{1})$/,/^([A-Z]{1})(\d{3})([A-Z]{2})$/,/^([A-Z]{3})(\d{2})([A-Z]{1})$/,/^([A-Z]{1})(\d{2})([A-Z]{3})$/,/^(\d{1})([A-Z]{2})(\d{3})$/,/^(\d{3})([A-Z]{2})(\d{1})$/];for(const r of rx){const m=c.match(r);if(m)return m[1]+'-'+m[2]+'-'+m[3]}return c.slice(0,2)+'-'+c.slice(2,4)+'-'+c.slice(4)}
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';setTimeout(()=>t.classList.remove('show'),3000)}
function authH(){return{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}}

// Modal helper
function openDeskModal(title,placeholder,defaultVal,onOk){
  const m=document.getElementById('deskModal');
  m.style.display='flex';
  document.getElementById('deskModalTitle').textContent=title;
  const inp=document.getElementById('deskModalInput');
  inp.placeholder=placeholder;inp.value=defaultVal||'';
  setTimeout(()=>inp.focus(),100);
  document.getElementById('deskModalOk').onclick=()=>{onOk(inp.value);closeDeskModal()};
}
function closeDeskModal(){document.getElementById('deskModal').style.display='none'}

// 401 interceptor
const _origFetch=window.fetch.bind(window);
window.fetch=async function(...args){
  const r=await _origFetch(...args);
  if(r.status===401 && TOKEN){doLogout();toast('Sessie verlopen','err')}
  return r;
};

async function exportPdf(){if(!LAST)return;const{v,r,plate,km}=LAST;try{const res=await fetch(API+'/api/pdf',{method:'POST',headers:authH(),body:JSON.stringify({vehicle:{...v,plate},result:r,market:LAST.m||{},km})});if(!res.ok)throw new Error('PDF mislukt');const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='CarDatax_'+plate+'.pdf';a.click();URL.revokeObjectURL(url);toast('PDF gedownload')}catch(e){toast('PDF: '+e.message,'err')}}
async function addToVoorraad(){if(!LAST)return;openDeskModal('Vraagprijs','Voer vraagprijs in',LAST.r.verkoopadviees||LAST.r.internetPrijs||'',async(prijs)=>{if(!prijs)return;const{v,r,plate,km}=LAST;try{const res=await fetch(API+'/api/voorraad/add',{method:'POST',headers:authH(),body:JSON.stringify({kenteken:plate,make:v.make,model:v.model,model_variant:v.modelVariant||'',year:v.year,fuel:v.fuel,km:km||0,color:v.color,body:v.body,power_kw:v.powerKw,power_hp:v.powerHp,engine_label:v.engineLabel,vraag_prijs:Number(prijs),apk_until:v.apkUntil||'',vin:v.vin||'',status:'te_koop'})});const d=await res.json();if(d.ok)toast('Aanbod op CarDatax!');else toast(d.error||'Fout','err')}catch{toast('Fout','err')}})}
async function startVeiling(){if(!LAST)return;openDeskModal('Minimumprijs','Voer minimumprijs in',LAST.r.inkoopLow||'',async(min)=>{if(!min)return;const{v,r,plate,km}=LAST;try{const res=await fetch(API+'/api/veiling',{method:'POST',headers:authH(),body:JSON.stringify({kenteken:plate,merk:v.make,model:v.model,bouwjaar:v.year,km:km||0,brandstof:v.fuel,minimumprijs:Number(min),duur_uren:24})});const d=await res.json();if(d.ok)toast('Veiling gestart!');else toast(d.error||'Fout','err')}catch{toast('Fout','err')}})}
async function addToPortfolio(){if(!LAST)return;const{v,r,plate}=LAST;const bod=r.t4cBod||Math.round((r.inkoopLow+r.inkoopHigh)/2);try{const res=await fetch(API+'/api/portfolio/add',{method:'POST',headers:authH(),body:JSON.stringify({kenteken:plate,make:v.make,model:v.model,year:v.year,inkoop_prijs:bod,vraag_prijs:r.verkoopadviees,status:'in_stock'})});const d=await res.json();if(d.ok)toast('Portfolio!');else toast(d.error||'Fout','err')}catch{toast('Fout','err')}}
function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('cdx_theme',t)}
if(localStorage.getItem('cdx_theme'))document.documentElement.dataset.theme=localStorage.getItem('cdx_theme');
checkAuth();
