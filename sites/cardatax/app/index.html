<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060810">
<title>CarDatax — Dealer Platform</title>
<link rel="icon" href="/m/favicon-32.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#060810;--bg2:#0a0e18;--surface:#0f1420;--surface2:#141a28;--surface3:#1a2134;--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.10);--accent:#22d68a;--accent2:#1abc78;--accent-dim:rgba(34,214,138,.10);--red:#ff5268;--red-dim:rgba(255,82,104,.10);--orange:#ffb340;--blue:#5ba0ff;--text:#e8ecf4;--text2:#8892a8;--text3:#505a70;--shadow:0 4px 24px rgba(0,0,0,.5);--radius:14px;--mono:'JetBrains Mono',ui-monospace,monospace;--font:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Layout */
.app{display:flex;height:100vh}
.sidebar{width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:24px}

/* Sidebar */
.sb-logo{padding:16px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sb-logo img{height:28px}
.sb-logo span{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.sb-section{padding:12px 12px 4px}
.sb-label{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;padding:0 8px;margin-bottom:6px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:.15s;border:1px solid transparent}
.sb-item:hover{background:rgba(255,255,255,.03);color:var(--text)}
.sb-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(34,214,138,.15)}
.sb-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-item .meta{font-size:10px;color:var(--text3);margin-left:auto;font-family:var(--mono)}
.sb-list{flex:1;overflow-y:auto;padding:4px 12px}
.sb-entry{padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.15s;margin-bottom:2px}
.sb-entry:hover{background:rgba(255,255,255,.03);border-color:var(--border2)}
.sb-entry.active{background:var(--accent-dim);border-color:rgba(34,214,138,.15)}
.sb-entry .plate{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--text)}
.sb-entry .sub{font-size:11px;color:var(--text3);margin-top:2px}
.sb-entry .price{font-size:12px;color:var(--accent);font-weight:600;margin-top:3px}
.sb-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-tab{flex:1;padding:10px;text-align:center;font-size:11px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;letter-spacing:.5px}
.sb-tab:hover{color:var(--text2)}
.sb-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Topbar */
.tb-title{font-weight:700;font-size:15px;color:var(--text)}
.tb-spacer{flex:1}
.tb-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;font-family:var(--font)}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.tb-user{font-size:12px;color:var(--text2)}

/* Panels */
.panel{display:none}.panel.active{display:block}

/* Taxatie form */
.tax-form{max-width:600px;margin:0 auto}
.plate-input-wrap{display:flex;align-items:center;background:var(--surface);border:2px solid var(--border2);border-radius:12px;overflow:hidden;margin-bottom:16px;transition:.2s}
.plate-input-wrap:focus-within{border-color:var(--accent)}
.plate-nl{background:#003082;color:#fff;padding:10px 12px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.plate-nl small{font-size:8px;color:rgba(255,255,255,.6)}
.plate-input{flex:1;background:none;border:none;color:var(--text);font-size:28px;font-weight:800;padding:14px 16px;font-family:var(--mono);letter-spacing:2px;text-transform:uppercase;outline:none}
.plate-input::placeholder{color:var(--text3);font-weight:400;letter-spacing:1px}
.km-row{display:flex;gap:12px;margin-bottom:20px}
.km-input-wrap{flex:1;position:relative}
.km-input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:12px 50px 12px 14px;color:var(--text);font-size:16px;font-family:var(--mono);outline:none;transition:.2s}
.km-input:focus{border-color:var(--accent)}
.km-suf{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;font-weight:600}
.tax-btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;font-family:var(--font)}
.tax-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.tax-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Steps */
.steps{display:flex;gap:4px;margin-bottom:24px}
.step{flex:1;padding:8px 12px;background:var(--surface);border-radius:8px;text-align:center;font-size:11px;color:var(--text3);position:relative;transition:.3s}
.step.active{background:var(--accent-dim);color:var(--accent)}
.step.done{background:rgba(34,214,138,.06);color:var(--accent)}
.step .step-n{font-weight:800;font-size:14px;display:block;margin-bottom:2px}

/* Result */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;transition:.2s}
.result-card:hover{border-color:var(--border2)}
.result-card .label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.result-card .value{font-size:24px;font-weight:800;color:var(--accent);font-family:var(--mono)}
.result-card .value.red{color:var(--red)}
.result-card .value.orange{color:var(--orange)}
.result-card .value.blue{color:var(--blue)}
.result-card .sub{font-size:11px;color:var(--text3);margin-top:4px}
.result-full{grid-column:1/-1}

/* Vehicle info */
.vehicle-header{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:20px}
.vehicle-header .make{font-size:22px;font-weight:800}
.vehicle-header .model{font-size:14px;color:var(--text2)}
.vehicle-header .plate-badge{font-family:var(--mono);font-size:14px;font-weight:700;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px;margin-left:auto}
.vehicle-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vtag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text2)}

/* AI Verdict */
.ai-verdict{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:20px}
.ai-verdict .ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;margin-bottom:8px}
.ai-verdict .ai-badge.ok{background:rgba(34,214,138,.1);color:var(--accent)}
.ai-verdict .ai-badge.warn{background:rgba(255,179,64,.1);color:var(--orange)}
.ai-verdict .ai-badge.bad{background:rgba(255,82,104,.1);color:var(--red)}
.ai-verdict .ai-text{font-size:13px;color:var(--text2);line-height:1.6}

/* Market list */
.market-list{max-height:300px;overflow-y:auto}
.market-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--border)}
.market-item:last-child{border:none}
.market-item .source{font-size:11px;color:var(--text3);width:100px;flex-shrink:0}
.market-item .title{font-size:12px;color:var(--text2);flex:1}
.market-item .mprice{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}

/* 3D Viewer */
.viewer-3d{width:100%;height:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;margin-bottom:20px}
.viewer-3d canvas{width:100%;height:100%}
.viewer-controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.viewer-controls button{padding:6px 14px;background:rgba(0,0,0,.6);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:11px;cursor:pointer;backdrop-filter:blur(8px)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:16px}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2)}

/* Empty state */
.empty{text-align:center;padding:40px;color:var(--text3)}
.empty svg{margin-bottom:12px;opacity:.3}

/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:40px;width:100%;max-width:380px;text-align:center}
.login-box input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:var(--accent)}
.login-box .btn{width:100%;padding:13px;background:var(--accent);color:#000;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

/* Responsive */
@media(max-width:768px){.sidebar{display:none}.content{padding:16px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <img src="/m/logo-cardatax-large.png" alt="CarDatax" style="height:50px;margin:0 auto 8px">
    <div style="color:var(--text3);font-size:12px;margin-bottom:24px;letter-spacing:1px">DEALER PLATFORM</div>
    <input id="lu" type="text" placeholder="Gebruikersnaam" autofocus>
    <input id="lp" type="password" placeholder="Wachtwoord" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">Inloggen</button>
    <div class="login-err" id="lErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" class="app" style="display:none">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-logo">
      <img src="/m/logo-cardatax-medium.png" alt="CarDatax">
      <span>Platform</span>
    </div>
    <div class="sb-section">
      <div class="sb-item active" onclick="showPanel('taxatie')">
        <div class="dot" style="background:var(--accent)"></div>
        Nieuwe Taxatie
      </div>
      <div class="sb-item" onclick="showPanel('scanner')">
        <div class="dot" style="background:var(--orange)"></div>
        Schade Scanner
      </div>
    </div>
    <div class="sb-tabs">
      <div class="sb-tab active" onclick="switchTab('taxaties')">Taxaties</div>
      <div class="sb-tab" onclick="switchTab('inspecties')">Inspecties</div>
    </div>
    <div class="sb-list" id="sb-list"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="tb-title" id="tb-title">Nieuwe Taxatie</div>
      <div class="tb-spacer"></div>
      <button class="tb-btn" onclick="window.open('/admin/')">Admin</button>
      <div class="tb-user" id="tb-user"></div>
      <button class="tb-btn" onclick="doLogout()">Uitloggen</button>
    </div>
    <div class="content" id="content">

      <!-- TAXATIE PANEL -->
      <div class="panel active" id="p-taxatie">
        <div class="tax-form">
          <div class="steps" id="tax-steps">
            <div class="step active"><span class="step-n">1</span>Kenteken</div>
            <div class="step"><span class="step-n">2</span>RDW Data</div>
            <div class="step"><span class="step-n">3</span>Markt</div>
            <div class="step"><span class="step-n">4</span>AI Prijs</div>
          </div>
          <div class="plate-input-wrap">
            <div class="plate-nl"><small>★★★</small>NL</div>
            <input class="plate-input" id="t-plate" placeholder="XX-999-X" maxlength="9" autocapitalize="characters" oninput="this.value=fmtPlate(this.value)">
          </div>
          <div class="km-row">
            <div class="km-input-wrap">
              <input class="km-input" id="t-km" type="text" inputmode="numeric" placeholder="Tellerstand">
              <span class="km-suf">km</span>
            </div>
          </div>
          <button class="tax-btn" id="t-btn" onclick="doTaxatie()">Taxeer voertuig</button>
          <div id="t-error" style="color:var(--red);font-size:12px;text-align:center;margin-top:12px;min-height:18px"></div>
        </div>

        <!-- RESULT (hidden until taxatie done) -->
        <div id="t-result" style="display:none;max-width:900px;margin:24px auto 0">
          <div class="vehicle-header" id="t-vehicle"></div>
          <div id="t-ai-verdict"></div>
          <div class="result-grid" id="t-prices"></div>
          <div id="t-market-section"></div>
        </div>
      </div>

      <!-- SCANNER PANEL -->
      <div class="panel" id="p-scanner">
        <div style="text-align:center;padding:40px">
          <div style="font-size:48px;margin-bottom:16px">📷</div>
          <div style="font-size:18px;font-weight:700;margin-bottom:8px">3D Schade Scanner</div>
          <div style="color:var(--text3);font-size:13px;margin-bottom:24px">Open de scanner op je telefoon voor de beste ervaring</div>
          <button class="tb-btn" onclick="window.open('/m/#walkaround')">Open Mobile Scanner</button>
        </div>
      </div>

      <!-- DETAIL PANEL (taxatie result from history) -->
      <div class="panel" id="p-detail">
        <div id="detail-content"></div>
      </div>

      <!-- INSPECTIE DETAIL PANEL -->
      <div class="panel" id="p-inspectie">
        <div id="inspectie-content"></div>
        <div id="photo-carousel" style="margin-bottom:20px;display:none">
          <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px">Scan Foto's</div>
          <div style="position:relative;border-radius:14px;overflow:hidden;border:1px solid rgba(34,214,138,.2);background:#000">
            <img id="pc-img" style="width:100%;display:block;min-height:300px;object-fit:cover">
            <canvas id="pc-canvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
            <div id="pc-labels" style="position:absolute;inset:0;pointer-events:none"></div>
            <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);padding:5px 14px;border-radius:16px;border:1px solid var(--accent);z-index:5">
              <span style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px">SCANNING</span>
              <span style="font-size:13px;font-weight:800;color:#fff">100%</span>
            </div>
            <div id="pc-angle" style="position:absolute;top:10px;left:10px;z-index:5;font-size:11px;font-weight:700;color:var(--accent);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:8px"></div>
            <button onclick="navPC(-1)" style="position:absolute;top:50%;left:8px;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;z-index:5">‹</button>
            <button onclick="navPC(1)" style="position:absolute;top:50%;right:8px;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;z-index:5">›</button>
            <div id="pc-dots" style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5"></div>
          </div>
        </div>
        <div class="viewer-3d" id="viewer-3d">
          <canvas id="viewer-canvas"></canvas>
          <div class="viewer-controls">
            <button onclick="camDistance=Math.max(3,camDistance-1);updateCamera()">🔍+</button>
            <button onclick="rotate3D(-1)">← Draai</button>
            <button onclick="reset3D()">Reset</button>
            <button onclick="rotate3D(1)">Draai →</button>
            <button onclick="camDistance=Math.min(15,camDistance+1);updateCamera()">🔍−</button>
          </div>
        </div>
        <div id="inspectie-gebreken"></div>
      </div>

    </div>
  </div>
</div>

<script>
const API = '';
let token = localStorage.getItem('t4c_token');
let user = null;
let currentTab = 'taxaties';
let taxHistory = [];
let inspHistory = [];
let lastResult = null;

// ═══ AUTH ═══
function H() { return { 'Authorization': 'Bearer ' + token } }

async function doLogin() {
  const u = document.getElementById('lu').value, p = document.getElementById('lp').value;
  const err = document.getElementById('lErr');
  try {
    const r = await fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
    const d = await r.json();
    if (d.ok) { token = d.token; user = d.user || d; localStorage.setItem('t4c_token', token); initApp(); }
    else err.textContent = d.error || 'Ongeldige inloggegevens';
  } catch (e) { err.textContent = 'Verbinding mislukt'; }
}

function doLogout() { localStorage.removeItem('t4c_token'); token = null; location.reload(); }

async function checkAuth() {
  if (!token) return false;
  try {
    const r = await fetch(API + '/api/me', { headers: H() });
    const d = await r.json();
    if (d.ok) { user = d; return true; }
  } catch {}
  return false;
}

// ═══ INIT ═══
async function initApp() {
  if (await checkAuth()) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'flex';
    document.getElementById('tb-user').textContent = user.name || user.username;
    loadHistory();
  }
}

// ═══ SIDEBAR ═══
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sb-tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase().includes(tab)));
  renderSidebar();
}

async function loadHistory() {
  try {
    const [tr, ir] = await Promise.allSettled([
      fetch(API + '/api/taxaties?limit=50', { headers: H() }).then(r => r.json()),
      fetch(API + '/api/inspecties', { headers: H() }).then(r => r.json())
    ]);
    taxHistory = tr.status === 'fulfilled' && tr.value.taxaties ? tr.value.taxaties : [];
    inspHistory = ir.status === 'fulfilled' && ir.value.inspecties ? ir.value.inspecties : [];
  } catch {}
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('sb-list');
  if (currentTab === 'taxaties') {
    if (!taxHistory.length) { list.innerHTML = '<div class="empty">Nog geen taxaties</div>'; return; }
    list.innerHTML = taxHistory.map((t, i) => `
      <div class="sb-entry" onclick="openTaxatie(${i})">
        <div class="plate">${fmtPlate(t.kenteken || '')}</div>
        <div class="sub">${t.make || ''} ${t.model || ''} · ${t.year || ''}</div>
        ${t.handelswaarde ? '<div class="price">€' + Math.round(t.handelswaarde).toLocaleString('nl-NL') + '</div>' : ''}
      </div>
    `).join('');
  } else {
    if (!inspHistory.length) { list.innerHTML = '<div class="empty">Nog geen inspecties</div>'; return; }
    list.innerHTML = inspHistory.map((ins, i) => `
      <div class="sb-entry" onclick="openInspectie(${i})">
        <div class="plate">${fmtPlate(ins.kenteken || '')}</div>
        <div class="sub">Score: ${ins.overall_score || ins.totaal_score || '?'}/10 · €${Math.round(ins.total_cost || ins.totaal_kosten || 0).toLocaleString('nl-NL')}</div>
      </div>
    `).join('');
  }
}

// ═══ PANELS ═══
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('p-' + id)?.classList.add('active');
  document.querySelectorAll('.sb-item').forEach(s => s.classList.remove('active'));
  const titles = { taxatie: 'Nieuwe Taxatie', scanner: 'Schade Scanner', detail: 'Taxatie Detail', inspectie: 'Inspectie Detail' };
  document.getElementById('tb-title').textContent = titles[id] || id;
}

// ═══ TAXATIE ═══
function setStep(n) {
  document.querySelectorAll('.step').forEach((s, i) => {
    s.classList.toggle('active', i === n - 1);
    s.classList.toggle('done', i < n - 1);
  });
}

async function doTaxatie() {
  const plate = document.getElementById('t-plate').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  const km = document.getElementById('t-km').value.replace(/[^0-9]/g, '');
  const err = document.getElementById('t-error');
  const btn = document.getElementById('t-btn');
  err.textContent = '';
  if (!plate || plate.length < 5) { err.textContent = 'Voer een geldig kenteken in'; return; }

  btn.disabled = true; btn.textContent = 'Bezig...';
  document.getElementById('t-result').style.display = 'none';

  try {
    // Step 1: RDW
    setStep(1);
    const vR = await fetch(API + '/api/vehicle/enriched?plate=' + plate + (km ? '&km=' + km : ''), { headers: H() });
    const v = await vR.json();
    if (v.error) throw new Error(v.error);
    if (!v.make) throw new Error('Kenteken niet gevonden bij RDW');

    // Step 2: Market
    setStep(2);
    const mR = await fetch(API + '/api/market?make=' + encodeURIComponent(v.make) + '&model=' + encodeURIComponent(v.model) + '&year=' + v.year + '&km=' + (km || 0) + '&sub=' + encodeURIComponent(v.subModel || '') + '&fuel=' + encodeURIComponent(v.fuel || ''));
    const m = await mR.json();

    // Step 3: Price
    setStep(3);
    const pR = await fetch(API + '/api/dealer/price', {
      method: 'POST', headers: { ...H(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ make: v.make, model: v.model, year: v.year, km: Number(km) || 0, fuel: v.fuel, catalogPrice: v.catalogPrice, bpm: v.bpm, power: v.powerKw, marketAvg: m?.avg, marketMedian: m?.median, marketCount: m?.count, marketPrices: m?.prices, marketP10: m?.p10, marketP25: m?.p25, marketP75: m?.p75, marketP90: m?.p90, finnikAvailable: !!v.finnikData, finnikWaardeLow: v.finnikData?.waardeLow, finnikWaardeHigh: v.finnikData?.waardeHigh, transmissionAuto: v.transmissionAuto, subModel: v.subModel, vin: v.vin })
    });
    const p = await pR.json();

    // Step 4: AI Validate
    setStep(4);
    let ai = null;
    try {
      const aiR = await fetch(API + '/api/ai/validate', {
        method: 'POST', headers: { ...H(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ voertuig: v, marktdata: m, berekendePrijzen: p })
      });
      const aiD = await aiR.json();
      ai = aiD.ai || null;
    } catch {}

    // Save
    try {
      await fetch(API + '/api/taxatie/save', {
        method: 'POST', headers: { ...H(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ kenteken: plate, make: v.make, model: v.model, model_variant: v.subModel || '', year: v.year, fuel: v.fuel, km: Number(km) || 0, color: v.color, body: v.body, power_kw: v.powerKw, power_hp: v.powerHp, engine_label: v.engineLabel, transmission: v.transmissionType, catalog_price: v.catalogPrice, bpm: v.bpm, market_avg: m?.avg, market_median: m?.median, market_count: m?.count, verkoopadviees: p.verkoopadviees, handelswaarde: p.handelswaarde, inkoop_low: p.inkoopLow, inkoop_high: p.inkoopHigh, internet_prijs: p.internetPrijs, apk_until: v.apkUntil, vin: v.vin, ai_json: JSON.stringify(ai) })
      });
    } catch {}

    lastResult = { v, m, p, ai };
    renderResult(v, m, p, ai);
    loadHistory();

  } catch (e) {
    err.textContent = e.message || 'Er ging iets mis';
    setStep(1);
  }
  btn.disabled = false; btn.textContent = 'Taxeer voertuig';
}

function eur(n) { return n ? '€ ' + Math.round(n).toLocaleString('nl-NL') : '—' }

  // Vehicle header
  document.getElementById('t-vehicle').innerHTML = `
    <div>
      <div class="make">${v.make || ''} ${v.model || ''}</div>
      <div class="model">${v.subModel || v.engineLabel || ''} · ${v.year || ''} · ${v.fuel || ''}</div>
      <div class="vehicle-tags">
        <span class="vtag">${v.powerHp || '?'} pk</span>
        <span class="vtag">${v.transmissionType || '?'}</span>
        <span class="vtag">${v.color || '?'}</span>
        ${v.body ? '<span class="vtag">' + v.body + '</span>' : ''}
        ${v.catalogPrice ? '<span class="vtag">Nieuwprijs ' + eur(v.catalogPrice) + '</span>' : ''}
      </div>
    </div>
    <div class="plate-badge">${fmtPlate(v.kenteken || document.getElementById('t-plate').value)}</div>

  if (ai && ai.beschikbaar !== false) {

    document.getElementById('t-ai-verdict').innerHTML = `

        ${ai.ai_schatting ? '<div style="font-size:13px;color:var(--text);margin:8px 0">AI inschatting: <strong>' + eur(ai.ai_schatting) + '</strong></div>' : ''}

  } else {

  // Prices
  document.getElementById('t-prices').innerHTML = `
    <div class="result-card">
      <div class="label">B2B Handelswaarde</div>
      <div class="value">${eur(p.handelswaarde)}</div>
      <div class="sub">Dealer-to-dealer</div>
    </div>
    <div class="result-card">
      <div class="label">B2C Verkoopadviees</div>
      <div class="value blue">${eur(p.verkoopadviees)}</div>
      <div class="sub">Consumentenprijs</div>
    </div>
    <div class="result-card">
      <div class="label">T4C Inkoopbod</div>
      <div class="value">${eur(p.t4cBod)}</div>
      <div class="sub">${eur(p.inkoopLow)} — ${eur(p.inkoopHigh)}</div>
    </div>
    <div class="result-card">
      <div class="label">Internet Vraagprijs</div>
      <div class="value blue">${eur(p.internetPrijs)}</div>
      <div class="sub">Online advertentie</div>
    </div>
    <div class="result-card">
      <div class="label">Markt Mediaan</div>
      <div class="value orange">${eur(m?.median)}</div>
      <div class="sub">${m?.count || 0} vergelijkbare auto's gevonden</div>
    </div>
    <div class="result-card">
      <div class="label">Winstmarge</div>
      <div class="value ${(p.profitRetail || 0) > 0 ? '' : 'red'}">${eur(p.profitRetail)}</div>
      <div class="sub">${p.marginPercent || 0}% · ${p.sellSpeed || '?'} (${p.sellDays || '?'} dgn)</div>

  // Market data
  if (m?.listings?.length) {
    document.getElementById('t-market-section').innerHTML = `

    `;
  } else {
    document.getElementById('t-market-section').innerHTML = '';
  }

  document.getElementById('t-result').scrollIntoView({ behavior: 'smooth' });
}

            <div style="font-size:12px;color:var(--text2);line-height:1.4">${d.description||''}</div>
          </div>
          <div style="font-family:var(--mono);font-size:13px;font-weight:700;color:var(--red);white-space:nowrap">${d.cost?eur(d.cost):''}</div>

  // Fallback: old gebreken table

    }

}

let pcPhotos = [], pcIdx = 0, pcDamages = [];
const pcAngleZones = {
  front:['voorbumper','motorkap','voorruit','links_voor','rechts_voor'],
  'front-right':['voorbumper','rechts_voor','deur_rechts','voorruit','motorkap'],
  right:['rechts_voor','rechts_achter','deur_rechts','velg_rv','velg_ra'],
  'rear-right':['achterbumper','rechts_achter','kofferbak','achterruit'],
  rear:['achterbumper','kofferbak','achterruit','links_achter','rechts_achter'],
  'rear-left':['achterbumper','links_achter','kofferbak','achterruit'],
  left:['links_voor','links_achter','deur_links','velg_lv','velg_la'],
  'front-left':['voorbumper','links_voor','deur_links','voorruit','motorkap']
};

async function loadScanPhotos(kenteken, damages) {
  pcDamages = damages;
  const plate = (kenteken || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  const carousel = document.getElementById('photo-carousel');
  try {
    const r = await fetch(API + '/api/scan-photos/' + plate, { headers: H() });
    const d = await r.json();
    if (d.ok && d.photos && d.photos.length) {
      pcPhotos = d.photos;
      pcIdx = 0;
      carousel.style.display = 'block';
      document.getElementById('pc-img').src = pcPhotos[0].url;
      document.getElementById('pc-angle').textContent = pcPhotos[0].angle || '';
      document.getElementById('pc-dots').innerHTML = pcPhotos.map((_, i) =>
        `<div onclick="goPC(${i})" style="width:7px;height:7px;border-radius:50%;background:${i === 0 ? 'var(--accent)' : 'rgba(255,255,255,.3)'};cursor:pointer"></div>`
      ).join('');
      setTimeout(() => drawPCOverlay(), 50);
    } else {
      carousel.style.display = 'none';
    }
  } catch { carousel.style.display = 'none'; }
}

function navPC(dir) { goPC(pcIdx + dir); }
function goPC(i) {
  if (i < 0) i = pcPhotos.length - 1;
  if (i >= pcPhotos.length) i = 0;
  pcIdx = i;
  document.getElementById('pc-img').src = pcPhotos[i].url;
  document.getElementById('pc-angle').textContent = pcPhotos[i].angle || '';
  document.getElementById('pc-dots').querySelectorAll('div').forEach((d, j) => {
    d.style.background = j === i ? 'var(--accent)' : 'rgba(255,255,255,.3)';
  });
  setTimeout(() => drawPCOverlay(), 50);
}

function drawPCOverlay() {
  const img = document.getElementById('pc-img');
  const cv = document.getElementById('pc-canvas');
  const lb = document.getElementById('pc-labels');
  if (!img || !cv) return;
  const w = img.clientWidth, h = img.clientHeight;
  cv.width = w * 2; cv.height = h * 2; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const x = cv.getContext('2d'); x.scale(2, 2);

  // Grid
  x.strokeStyle = 'rgba(34,214,138,.04)'; x.lineWidth = 0.5;
  for (let i = 0; i <= w; i += 18) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let i = 0; i <= h; i += 18) { x.beginPath(); x.moveTo(0, i); x.lineTo(w, i); x.stroke(); }

  // Corner brackets
  const m = 10, bl = 30;
  x.shadowColor = 'rgba(34,214,138,.5)'; x.shadowBlur = 8; x.strokeStyle = '#22d68a'; x.lineWidth = 2.5; x.lineCap = 'round';
  x.beginPath(); x.moveTo(m, m + bl); x.lineTo(m, m); x.lineTo(m + bl, m); x.stroke();
  x.beginPath(); x.moveTo(w - m - bl, m); x.lineTo(w - m, m); x.lineTo(w - m, m + bl); x.stroke();
  x.beginPath(); x.moveTo(m, h - m - bl); x.lineTo(m, h - m); x.lineTo(m + bl, h - m); x.stroke();
  x.beginPath(); x.moveTo(w - m - bl, h - m); x.lineTo(w - m, h - m); x.lineTo(w - m, h - m - bl); x.stroke();
  x.shadowBlur = 0;

  // Labels
  lb.innerHTML = '';
  const angle = pcPhotos[pcIdx]?.angle || '';
  const vis = pcAngleZones[angle] || [];
  const hit = new Set(pcDamages.map(d => d.zone));
  const cx = w / 2;
  const pos = {
    voorbumper:{x:cx,y:h*.82},motorkap:{x:cx,y:h*.55},voorruit:{x:cx,y:h*.35},dak:{x:cx,y:h*.22},
    achterruit:{x:cx,y:h*.35},kofferbak:{x:cx,y:h*.55},achterbumper:{x:cx,y:h*.82},
    links_voor:{x:w*.18,y:h*.5},links_achter:{x:w*.18,y:h*.55},rechts_voor:{x:w*.82,y:h*.5},
    rechts_achter:{x:w*.82,y:h*.55},deur_links:{x:w*.15,y:h*.48},deur_rechts:{x:w*.85,y:h*.48},
    velg_lv:{x:w*.22,y:h*.78},velg_rv:{x:w*.78,y:h*.78},velg_la:{x:w*.22,y:h*.78},velg_ra:{x:w*.78,y:h*.78}
  };
  const zoneNL = {motorkap:'Motorkap',voorruit:'Voorruit',dak:'Dak',achterruit:'Achterruit',kofferbak:'Kofferbak',voorbumper:'Voorbumper',achterbumper:'Achterbumper',links_voor:'Links-voor',links_achter:'Links-achter',rechts_voor:'Rechts-voor',rechts_achter:'Rechts-achter',deur_links:'Linker deur',deur_rechts:'Rechter deur'};

  for (const z of vis) {
    const p = pos[z]; if (!p) continue;
    if (hit.has(z)) {
      const d = pcDamages.find(dm => dm.zone === z); if (!d) continue;
      x.fillStyle = 'rgba(255,82,104,.12)'; x.beginPath(); x.arc(p.x, p.y, 35, 0, Math.PI * 2); x.fill();
      x.strokeStyle = 'rgba(255,82,104,.4)'; x.lineWidth = 1.5; x.stroke();
      const t = document.createElement('div');
      t.style.cssText = `position:absolute;left:${p.x+30}px;top:${p.y-20}px;z-index:4;background:rgba(60,0,0,.75);border:1px solid var(--red);border-radius:8px;padding:8px 12px;max-width:180px;backdrop-filter:blur(4px);pointer-events:none`;
      t.innerHTML = `<div style="font-size:9px;color:rgba(255,255,255,.5)">⚠️ ${d.type || 'Schade'}</div><div style="font-size:12px;font-weight:800;color:#fff;margin:2px 0">${zoneNL[z] || z}</div><div style="font-size:10px;color:rgba(255,255,255,.7)">${d.description || ''}</div>${d.cost ? '<div style="font-size:11px;font-weight:700;color:var(--red);margin-top:3px">€' + d.cost.toLocaleString('nl-NL') + '</div>' : ''}`;
      lb.appendChild(t);
    } else {
      const t = document.createElement('div');
      t.style.cssText = `position:absolute;left:${p.x}px;top:${p.y}px;z-index:4;background:rgba(0,40,20,.6);border:1px solid var(--accent);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:800;color:var(--accent);pointer-events:none`;
      t.textContent = 'OK';
      lb.appendChild(t);
    }
  }
}

function init3DViewer(ins, damages) {
  const container = document.getElementById('viewer-3d');
  const canvas = document.getElementById('viewer-canvas');
  if (!container || !canvas) return;

  if (animFrame) cancelAnimationFrame(animFrame);
  if (renderer3d) renderer3d.dispose();

  const w = container.clientWidth, h = container.clientHeight;
  camDistance = 7; camAngleY = 0.7; camAngleX = 0.4;

  scene3d = new THREE.Scene();
  scene3d.background = new THREE.Color(0x080e16);
  scene3d.fog = new THREE.Fog(0x080e16, 15, 30);

  camera3d = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  updateCamera();

  renderer3d = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer3d.setSize(w, h);
  renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene3d.add(new THREE.AmbientLight(0x225533, 0.5));
  const dir = new THREE.DirectionalLight(0x66ffaa, 0.6);
  dir.position.set(5, 8, 4); scene3d.add(dir);
  const rim = new THREE.DirectionalLight(0x22d68a, 0.3);
  rim.position.set(-3, 2, -4); scene3d.add(rim);

  scene3d.add(new THREE.GridHelper(20, 40, 0x0a1a12, 0x060e0a));

  carGroup = new THREE.Group();
  buildCarModel(carGroup);
  scene3d.add(carGroup);

  // Add OK labels on clean zones
  if (damages && damages.length) {
    const allZones = ['motorkap','kofferbak','dak','voorbumper','achterbumper','links_voor','links_achter','rechts_voor','rechts_achter','deur_links','deur_rechts'];
    const hit = new Set(damages.map(d => d.zone));
    for (const z of allZones) {
      if (!hit.has(z)) { const c = zonePos3D[z]; if (c) addOKSprite(carGroup, c); }
    }
    addDamageMarkersFromAI(damages);
  }

  // Animate
  const clock = new THREE.Clock();
  function animate() {
    animFrame = requestAnimationFrame(animate);
    // Pulse damage markers
    const t = clock.getElapsedTime() * 3;
    carGroup.traverse(c => {
      if (c.userData.pulse) { const s = .85 + Math.sin(t + c.userData.ph) * .2; c.scale.set(s,s,s); }
      if (c.userData.ring) c.lookAt(camera3d.position);
    });
    renderer3d.render(scene3d, camera3d);
  }
  animate();

  // Mouse drag rotate
  let dragging = false, lastX = 0, lastY = 0;
  canvas.onmousedown = e => { dragging = true; lastX = e.clientX; lastY = e.clientY; };
  canvas.onmousemove = e => {
    if (!dragging) return;
    camAngleY += (e.clientX - lastX) * 0.008;
    camAngleX = Math.max(0.1, Math.min(1.4, camAngleX - (e.clientY - lastY) * 0.008));
    lastX = e.clientX; lastY = e.clientY;
    updateCamera();
  };
  canvas.onmouseup = () => dragging = false;
  canvas.onmouseleave = () => dragging = false;

  // Scroll zoom
  canvas.onwheel = e => {
    e.preventDefault();
    camDistance = Math.max(3, Math.min(15, camDistance + e.deltaY * 0.01));
    updateCamera();
  };
}

function updateCamera() {
  if (!camera3d) return;
  camera3d.position.set(
    Math.sin(camAngleY) * Math.cos(camAngleX) * camDistance,
    Math.sin(camAngleX) * camDistance,
    Math.cos(camAngleY) * Math.cos(camAngleX) * camDistance
  );
  camera3d.lookAt(0, 0.5, 0);
}

const zonePos3D = {
  motorkap:{x:0,y:.85,z:1.5},voorruit:{x:0,y:1.15,z:.7},dak:{x:0,y:1.3,z:0},achterruit:{x:0,y:1.15,z:-.7},kofferbak:{x:0,y:.85,z:-1.5},voorbumper:{x:0,y:.35,z:1.85},achterbumper:{x:0,y:.35,z:-1.85},links_voor:{x:-.92,y:.6,z:1},links_achter:{x:-.92,y:.6,z:-1},rechts_voor:{x:.92,y:.6,z:1},rechts_achter:{x:.92,y:.6,z:-1},deur_links:{x:-.95,y:.7,z:0},deur_rechts:{x:.95,y:.7,z:0},velg_lv:{x:-.92,y:.3,z:1.15},velg_rv:{x:.92,y:.3,z:1.15},velg_la:{x:-.92,y:.3,z:-1.15},velg_ra:{x:.92,y:.3,z:-1.15}
};

function buildCarModel(group) {
  const wm = new THREE.LineBasicMaterial({color:0x22d68a, transparent:true, opacity:.6});
  const gm = new THREE.MeshBasicMaterial({color:0x22d68a, transparent:true, opacity:.04, side:THREE.DoubleSide});
  const bm = new THREE.LineBasicMaterial({color:0x33ffaa, transparent:true, opacity:.8});

  // Lower body
  const lbG = new THREE.BoxGeometry(1.76, .9, 3.9);
  lbG.translate(0, .45, 0);
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(lbG), wm));
  group.add(new THREE.Mesh(lbG, gm));

  // Cabin
  const cabShape = new THREE.Shape();
  cabShape.moveTo(-.68,.88);cabShape.lineTo(-.60,1.42);cabShape.lineTo(-.50,1.48);
  cabShape.lineTo(.50,1.48);cabShape.lineTo(.60,1.42);cabShape.lineTo(.68,.88);cabShape.closePath();
  const cabG = new THREE.ExtrudeGeometry(cabShape,{depth:2.1,bevelEnabled:false});
  cabG.translate(0,0,-1.1);
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(cabG), wm));
  group.add(new THREE.Mesh(cabG, gm));

  // Windshields
  const ln = (a,b) => group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]), bm));
  ln([-.68,.88,.95],[-.60,1.42,.65]);ln([.68,.88,.95],[.60,1.42,.65]);
  ln([-.60,1.42,.65],[.60,1.42,.65]);ln([-.68,.88,.95],[.68,.88,.95]);
  ln([-.68,.88,-1.1],[-.60,1.42,-.85]);ln([.68,.88,-1.1],[.60,1.42,-.85]);
  ln([-.60,1.42,-.85],[.60,1.42,-.85]);
  ln([-.68,.88,0],[-.58,1.46,0]);ln([.68,.88,0],[.58,1.46,0]);

  // Wheels
  for(const[wx,wy,wz] of [[-0.9,.32,1.15],[.9,.32,1.15],[-.9,.32,-1.15],[.9,.32,-1.15]]){
    const tg = new THREE.TorusGeometry(.27,.09,8,16);
    const tw = new THREE.LineSegments(new THREE.EdgesGeometry(tg),wm);
    tw.rotation.y=Math.PI/2;tw.position.set(wx,wy,wz);group.add(tw);
    const hg = new THREE.CircleGeometry(.16,10);
    const hw = new THREE.LineSegments(new THREE.EdgesGeometry(hg),wm);
    hw.rotation.y=wx>0?Math.PI/2:-Math.PI/2;hw.position.set(wx+(wx>0?.01:-.01),wy,wz);group.add(hw);
  }

  // Headlights + taillights
  for(const sx of[-.5,.5]){const h=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CircleGeometry(.1,8)),bm);h.position.set(sx,.6,1.96);group.add(h)}
  for(const sx of[-.5,.5]){const t=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(.18,.07)),bm);t.position.set(sx,.65,-1.96);group.add(t)}

  // Character lines + door lines
  ln([-.89,.6,1.5],[-.89,.6,-1.5]);ln([.89,.6,1.5],[.89,.6,-1.5]);
  ln([-.89,.2,.5],[-.89,.88,.5]);ln([.89,.2,.5],[.89,.88,.5]);
  ln([-.89,.2,-.5],[-.89,.88,-.5]);ln([.89,.2,-.5],[.89,.88,-.5]);
  ln([-.3,.66,1.95],[-.3,.66,.95]);ln([.3,.66,1.95],[.3,.66,.95]);
  ln([-.3,.66,-1.1],[-.3,.66,-1.95]);ln([.3,.66,-1.1],[.3,.66,-1.95]);

  // Mirrors
  for(const sx of[-1,1]){const mg=new THREE.BoxGeometry(.07,.05,.1);const mw=new THREE.LineSegments(new THREE.EdgesGeometry(mg),wm);mw.position.set(sx*.97,.9,.55);group.add(mw)}
}

function addDamageMarkersFromAI(damages) {
  if (!carGroup) return;
  for (const d of damages) {
    const c = zonePos3D[d.zone];
    if (!c) continue;
    const sev = d.severity || d.sev || 'gemiddeld';
    const col = sev==='ernstig'?0xff2244:sev==='gemiddeld'?0xff8833:0xffcc00;

    const sp = new THREE.Mesh(new THREE.SphereGeometry(.1,12,12), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.75}));
    sp.position.set(c.x,c.y,c.z);sp.userData={pulse:true,ph:Math.random()*6};carGroup.add(sp);

    const rn = new THREE.Mesh(new THREE.RingGeometry(.13,.18,20), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.3,side:THREE.DoubleSide}));
    rn.position.copy(sp.position);rn.userData={ring:true};carGroup.add(rn);

    // Glow
    const gl = new THREE.Mesh(new THREE.SphereGeometry(.22,12,12), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.08}));
    gl.position.set(c.x,c.y,c.z);carGroup.add(gl);
  }
}

function addOKSprite(group, c) {
  const cv = document.createElement('canvas');cv.width=64;cv.height=32;const x=cv.getContext('2d');
  x.fillStyle='rgba(34,214,138,.2)';x.beginPath();x.roundRect(0,0,64,32,8);x.fill();
  x.fillStyle='#22d68a';x.font='bold 16px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('OK',32,17);
  const t=new THREE.CanvasTexture(cv);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,opacity:.75}));
  s.position.set(c.x,c.y+.25,c.z);s.scale.set(.4,.2,1);group.add(s);
}

function addDamageMarkers(gebreken) {
  if (!carGroup) return;
  const zonePos = {
    'voorkant': {x:0,y:.85,z:1.5}, 'achterkant': {x:0,y:.85,z:-1.5},
    'links_voor': {x:-.92,y:.6,z:1}, 'links_achter': {x:-.92,y:.6,z:-1},
    'rechts_voor': {x:.92,y:.6,z:1}, 'rechts_achter': {x:.92,y:.6,z:-1},
    'dak': {x:0,y:1.3,z:0}, 'motorkap': {x:0,y:.85,z:1.5}, 'kofferbak': {x:0,y:.85,z:-1.5}
  };
  for (const g of gebreken) {
    const loc = (g.locatie || '').toLowerCase().replace(/\s+/g, '_');
    let pos = zonePos[loc];
    if (!pos) for (const [k, v] of Object.entries(zonePos)) { if (loc.includes(k.split('_')[0])) { pos = v; break; } }
    if (!pos) pos = {x:Math.random()*2-1, y:1, z:Math.random()*1.4-.7};
    const color = g.ernst === 'ernstig' ? 0xff5268 : g.ernst === 'matig' ? 0xffb340 : 0x22d68a;
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.75}));
    sphere.position.set(pos.x, pos.y, pos.z); sphere.userData={pulse:true,ph:Math.random()*6};
    carGroup.add(sphere);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.13, 0.18, 20), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.3, side:THREE.DoubleSide}));
    ring.position.copy(sphere.position); ring.userData={ring:true};
    carGroup.add(ring);
  }
}

function rotate3D(dir) { camAngleY += dir * 0.5; updateCamera(); }
function reset3D() { camAngleY = 0.7; camAngleX = 0.4; camDistance = 7; updateCamera(); }

// ═══ UTILS ═══
function fmtPlate(v) {
  v = v.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  if (v.length >= 6) {
    // Dutch plate format detection
    const patterns = [/^([A-Z]{2})(\d{3})([A-Z])$/, /^(\d)([A-Z]{3})(\d{2})$/, /^(\d{2})([A-Z]{3})(\d)$/, /^([A-Z]{2})(\d{2})([A-Z]{2})$/, /^(\d{2})([A-Z]{2})(\d{2})$/, /^([A-Z]{2})(\d{2})(\d{2})$/];
    for (const p of patterns) {
      const m = v.match(p);
      if (m) return m[1] + '-' + m[2] + '-' + m[3];
    }
  }
  return v;
}
