<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarDatax — Dealer Dashboard</title>
<meta name="theme-color" content="#060709">
<link rel="icon" href="/m/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#08090c;--bg1:#0d0f14;--bg2:#13161d;--bg3:#1a1e28;--green:#00FF9C;--green-dim:rgba(0,255,156,.07);--green-border:rgba(0,255,156,.12);--red:#ff4d4d;--orange:#f59e0b;--blue:#4da6ff;--text0:#fff;--text1:#d4d8e3;--text2:#7a8194;--text3:#454d60;--border:rgba(255,255,255,.06);--font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono','SF Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:var(--font);background:var(--bg0);color:var(--text1);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
.topbar{grid-column:1/-1;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;z-index:10}
.topbar-logo{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--text0);letter-spacing:-.3px;text-decoration:none}.topbar-logo img{height:26px}.topbar-logo em{color:var(--green);font-style:normal}
.topbar-sep{width:1px;height:24px;background:var(--border)}



.tr{margin-left:auto;display:flex;align-items:center;gap:14px}
.badge{background:var(--green-dim);border:1px solid var(--green-border);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;color:var(--green)}
.ham{display:none;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text1);padding:4px 10px;cursor:pointer;font-size:16px}
.sidebar{background:var(--bg1);border-right:1px solid var(--border);padding:16px 0;overflow-y:auto;display:flex;flex-direction:column}
.ss{padding:0 12px;margin-bottom:20px}.sl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;padding:0 12px;margin-bottom:6px}
.si{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-decoration:none}.si:hover{background:var(--bg2);color:var(--text1)}.si.a{background:var(--green-dim);color:var(--green)}
.si .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}.sc{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--text3);background:var(--bg2);padding:2px 7px;border-radius:4px}
.sb{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.main{padding:24px;overflow-y:auto}.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.mt{font-size:22px;font-weight:700;color:var(--text0);letter-spacing:-.3px}.ms{font-size:13px;color:var(--text3);margin-top:2px}
.pg{display:none}.pg.a{display:block}
.kr{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.k{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:18px 16px;transition:.2s}.k:hover{border-color:var(--green-border)}
.kl{font-size:11px;color:var(--text3)}.kv{font-size:28px;font-weight:700;font-family:var(--mono);color:var(--text0);margin-top:6px;letter-spacing:-.5px}.kv.g{color:var(--green)}.kv.r{color:var(--red)}.kc{font-size:11px;font-family:var(--mono);margin-top:4px;color:var(--text3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}.g3{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.c{background:var(--bg1);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ch{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ct{font-size:13px;font-weight:600;color:var(--text1)}.ca{font-size:11px;color:var(--green);font-weight:600;cursor:pointer;padding:4px 8px;border-radius:4px;background:none;border:none;font-family:var(--font)}.ca:hover{background:var(--green-dim)}
.cb{padding:16px}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:8px 12px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;font-size:13px;color:var(--text1);border-bottom:1px solid var(--border)}tr:last-child td{border-bottom:none}tr:hover td{background:rgba(255,255,255,.015)}
.m{font-family:var(--mono);font-weight:500}.gr{color:var(--green)}.rd{color:var(--red)}.dm{color:var(--text3)}
.p{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600}
.pg_{background:var(--green-dim);color:var(--green)}.po{background:rgba(245,158,11,.1);color:var(--orange)}.pr{background:rgba(255,77,77,.1);color:var(--red)}.pb{background:rgba(77,166,255,.1);color:var(--blue)}
.sr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.sr:last-child{border-bottom:none}
.ar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.ar:last-child{border-bottom:none}
.ad{width:6px;height:6px;border-radius:50%;flex-shrink:0}.at{font-size:12px;color:var(--text2);flex:1}.am{font-size:11px;color:var(--text3);font-family:var(--mono)}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border:none;transition:.15s}
.bp{background:var(--green);color:#000}.bp:hover{filter:brightness(1.1)}.bg{background:var(--bg2);color:var(--text2);border:1px solid var(--border)}.bg:hover{border-color:var(--green-border);color:var(--text1)}
.fi{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--text1);outline:none;font-family:var(--font);box-sizing:border-box}.fi:focus{border-color:var(--green-border)}.fi::placeholder{color:var(--text3)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--bg1);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:90vw}.modal-title{font-size:18px;font-weight:700;color:var(--text0);margin-bottom:16px}
.alert{padding:12px 16px;border-radius:8px;border-left:3px solid;margin-bottom:8px;font-size:13px}
.alert-warn{background:rgba(245,158,11,.06);border-color:var(--orange)}.alert-ok{background:var(--green-dim);border-color:var(--green)}.alert-info{background:rgba(77,166,255,.06);border-color:var(--blue)}
.alert .atn{font-weight:600;margin-bottom:2px;color:var(--text0)}.alert .atm{font-size:12px;color:var(--text2)}
.briefing{background:linear-gradient(135deg,rgba(0,255,156,.04),rgba(0,255,156,.01));border:1px solid var(--green-border);border-radius:12px;padding:20px;margin-bottom:20px}
.briefing-title{font-size:14px;font-weight:700;color:var(--green);margin-bottom:8px}.briefing-text{font-size:13px;color:var(--text1);line-height:1.7}
@media(max-width:1100px){.kr{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:900px){.shell{grid-template-columns:1fr;grid-template-rows:56px 1fr}.sidebar{display:none;position:fixed;top:56px;left:0;bottom:0;width:260px;z-index:50;background:var(--bg1);box-shadow:4px 0 24px rgba(0,0,0,.5)}.sidebar.open{display:flex}.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}.sb-overlay.open{display:block}.ham{display:flex!important}table{display:block;overflow-x:auto}.kr{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
@media(max-width:500px){.kr{grid-template-columns:1fr}.kv{font-size:22px}}
</style>
</head>
<body>
<div class="shell">
<div class="topbar">
  <button class="ham" onclick="document.getElementById('sb').classList.toggle('open');document.getElementById('sbo').classList.toggle('open')">☰</button>
  <a href="/m/" class="topbar-logo"><img src="/m/logo-cardatax-medium.png" alt="" onerror="this.style.display='none'">Car<em>Datax</em></a>
  <div class="topbar-sep"></div>
  <div class="tr"><div class="badge">Crawler actief</div><a href="/m/" style="font-size:13px;color:var(--text2);text-decoration:none">App</a></div>
</div>
<div class="sidebar" id="sb"></div>
<div class="main"><div id="p-home" class="pg a"></div><div id="p-voorraad" class="pg"></div><div id="p-inkoop" class="pg"></div><div id="p-financieel" class="pg"></div><div id="p-leads" class="pg"></div><div id="p-markt" class="pg"></div><div id="p-aankopen" class="pg"></div><div id="p-taxatie" class="pg"></div><div id="p-inspecties" class="pg"></div><div id="p-veilingenbeheer" class="pg"></div><div id="p-facturen" class="pg"></div></div>
</div>
<div class="sb-overlay" id="sbo" onclick="document.getElementById('sb').classList.remove('open');this.classList.remove('open')"></div>
<script>
var T=localStorage.getItem('t4c_token'),U=null;try{U=JSON.parse(localStorage.getItem('t4c_user'))}catch(e){}
if(!T)window.location='/m/';
function H(){return{'Authorization':'Bearer '+T,'Content-Type':'application/json'}}
function E(n){return n!=null&&isFinite(n)?'\u20ac'+Math.round(n).toLocaleString('nl-NL'):'\u2014'}
function qT(){go("taxatie")}
function closeSB(){document.getElementById('sb').classList.remove('open');document.getElementById('sbo').classList.remove('open')}
function buildSB(){var r=(U&&U.role)?U.role.toLowerCase():'koper';var h='<div class="ss"><div class="sl">Overzicht</div><a class="si a" data-p="home"><span class="d" style="background:var(--green)"></span> Dashboard</a>';if(r!=='koper')h+='<a class="si" onclick="qT()"><span class="d" style="background:var(--blue)"></span> Snelle Taxatie</a><a class="si" data-p="inspecties"><span class="d" style="background:var(--cyan,var(--blue))"></span> Inspecties</a>';h+='</div>';if(r!=='koper'){h+='<div class="ss"><div class="sl">Handel</div><a class="si" data-p="voorraad"><span class="d" style="background:var(--text2)"></span> Voorraad <span class="sc" id="sV">\u2014</span></a><a class="si" data-p="inkoop"><span class="d" style="background:var(--orange)"></span> Inkoop <span class="sc" id="sI">\u2014</span></a><a class="si" data-p="veilingenbeheer"><span class="d" style="background:var(--blue)"></span> Veilingen</a></div>';h+='<div class="ss"><div class="sl">Relaties</div><a class="si" data-p="leads"><span class="d" style="background:var(--text2)"></span> Leads <span class="sc" id="sL">\u2014</span></a></div>';h+='<div class="ss"><div class="sl">Aankopen</div><a class="si" data-p="aankopen"><span class="d" style="background:var(--blue)"></span> Mijn Aankopen</a></div>';h+='<div class="ss"><div class="sl">Inzicht</div><a class="si" data-p="financieel"><span class="d" style="background:var(--green)"></span> Financieel</a><a class="si" data-p="facturen"><span class="d" style="background:var(--orange)"></span> Facturen</a><a class="si" data-p="markt"><span class="d" style="background:var(--text2)"></span> Marktdata</a></div>';}h+='<div class="sb"><a class="si" href="/m/" style="color:var(--text3)"><span class="d" style="background:var(--text3)"></span> Mobiele App</a>';if(r==='admin')h+='<a class="si" href="/admin/" style="color:var(--text3)"><span class="d" style="background:var(--text3)"></span> Admin</a>';h+='</div>';document.getElementById('sb').innerHTML=h;document.querySelectorAll('.si[data-p]').forEach(function(el){el.addEventListener('click',function(){go(el.getAttribute('data-p'));closeSB()})})}
function go(p){document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('a')});document.querySelectorAll('.si').forEach(function(x){x.classList.remove('a')});var el=document.getElementById('p-'+p);if(!el){el=document.getElementById('p-home');p='home'}el.classList.add('a');var s=document.querySelector('.si[data-p="'+p+'"]');if(s)s.classList.add('a');({home:rHome,voorraad:rVoorraad,inkoop:rInkoop,financieel:rFinancieel,leads:rLeads,markt:rMarkt,aankopen:rAankopen,taxatie:rTaxatie,inspecties:rInspecties,veilingenbeheer:rVeilingenBeheer,facturen:rFacturen}[p]||rHome)()}
async function rHome(){var el=document.getElementById('p-home');var hr=new Date().getHours();var dt=new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});var g=(hr<12?'Goedemorgen':hr<18?'Goedemiddag':'Goedenavond')+', '+(U?.name||'Dealer');el.innerHTML='<div class="mh"><div><div class="mt">'+g+'</div><div class="ms">'+dt+'</div></div><div style="display:flex;gap:8px"><button class="btn bg" onclick="go(\'financieel\')">Maandoverzicht</button><button class="btn bp" onclick="qT()">+ Taxatie</button></div></div><div id="briefing-box"></div><div id="alerts-box" style="margin-bottom:16px"></div><div class="kr"><div class="k"><div class="kl">Voorraad</div><div class="kv" id="h1">\u2014</div><div class="kc">auto\'s</div></div><div class="k"><div class="kl">Vraagprijzen</div><div class="kv g" id="h2">\u2014</div><div class="kc">totaal</div></div><div class="k"><div class="kl">Winst / mnd</div><div class="kv g" id="h3">\u2014</div><div class="kc">deze maand</div></div><div class="k"><div class="kl">Gem. stadagen</div><div class="kv" id="h4">\u2014</div><div class="kc">dagen</div></div><div class="k"><div class="kl">Marktdata</div><div class="kv" id="h5">\u2014</div><div class="kc">prijspunten</div></div></div><div class="g3"><div class="c"><div class="ch"><div class="ct">Recente taxaties</div></div><div class="cb" style="padding:0"><table><thead><tr><th>Kenteken</th><th>Auto</th><th>Jaar</th><th>Waarde</th></tr></thead><tbody id="hT"><tr><td colspan="4" class="dm" style="text-align:center;padding:24px">Laden...</td></tr></tbody></table></div></div><div class="c"><div class="ch"><div class="ct">Meldingen</div><button class="ca" onclick="readAll()">Gelezen</button></div><div class="cb" id="hA">Laden...</div></div></div><div class="c" style="margin-bottom:24px"><div class="ch"><div class="ct" style="color:var(--green)">Arbitrage Deals</div><button class="ca" onclick="lArb()">Vernieuwen</button></div><div class="cb" style="padding:0"><table><thead><tr><th>Auto</th><th>Jaar</th><th>KM</th><th>Prijs</th><th>Markt</th><th>Korting</th><th>Bron</th><th></th></tr></thead><tbody id="hB"><tr><td colspan="8" class="dm" style="text-align:center;padding:24px">Laden...</td></tr></tbody></table></div></div><div class="g2"><div class="c"><div class="ch"><div class="ct">Reprice</div><button class="ca" onclick="tRep()">Check</button></div><div class="cb" style="padding:0"><table><thead><tr><th>Auto</th><th>Dagen</th><th>Huidig</th><th>Suggestie</th></tr></thead><tbody id="hR"><tr><td colspan="4" class="dm" style="text-align:center;padding:24px">Laden...</td></tr></tbody></table></div></div><div class="c"><div class="ch"><div class="ct">Inkoop</div><button class="ca" onclick="go(\'inkoop\')">Beheren</button></div><div class="cb" style="padding:0"><table><thead><tr><th>Auto</th><th>Bod</th><th>Status</th></tr></thead><tbody id="hI"><tr><td colspan="3" class="dm" style="text-align:center;padding:24px">Laden...</td></tr></tbody></table></div></div></div>';lHome();lArb();lBriefing();lAlerts()}
async function lBriefing(){try{var r=await fetch('/api/intelligence/briefing',{headers:H()});var d=await r.json();if(!d.ok)return;var s=d.summary;var h='<div class="briefing"><div class="briefing-title">\u2728 Dagelijks overzicht</div><div class="briefing-text">';if(s.rising_models?.length)h+='<strong style="color:var(--green)">\u2191</strong> '+s.rising_models.join(', ')+'<br>';if(s.falling_models?.length)h+='<strong style="color:var(--red)">\u2193</strong> '+s.falling_models.join(', ')+'<br>';h+=s.active_listings+' listings \u00b7 '+s.arbitrage_count+' arbitrage \u00b7 '+s.recent_taxaties+' taxaties</div></div>';document.getElementById('briefing-box').innerHTML=h}catch(e){}}
async function lAlerts(){try{var r=await fetch('/api/intelligence/alerts',{headers:H()});var d=await r.json();if(!d.ok||!d.alerts?.length){document.getElementById('alerts-box').innerHTML='';return}document.getElementById('alerts-box').innerHTML=d.alerts.slice(0,5).map(function(a){var c=a.severity==='warning'?'alert-warn':a.severity==='success'?'alert-ok':'alert-info';return'<div class="alert '+c+'"><div class="atn">'+a.title+'</div><div class="atm">'+a.message+'</div></div>'}).join('')}catch(e){}}
async function lHome(){try{var r=await fetch('/api/dashboard/voorraad',{headers:H()});var d=await r.json();document.getElementById('h1').textContent=d.voorraad?.aantal||0;document.getElementById('h2').textContent=E(d.voorraad?.totale_vraagprijs);document.getElementById('h4').textContent=d.voorraad?.gem_stadagen||0;document.getElementById('sV').textContent=d.voorraad?.aantal||0;var m=new Date().toISOString().slice(0,7);var r3=await fetch('/api/dashboard/maand/'+m,{headers:H()});var d3=await r3.json();document.getElementById('h3').textContent=E(d3.verkocht?.winst||0);var r4=await fetch('/api/intelligence/accuracy',{headers:H()}).catch(function(){return{json:function(){return{}}}});var d4=await r4.json();var dp4=d4.data_points||{};document.getElementById('h5').textContent=(dp4.total_snapshots||d4.market_snapshots||0).toLocaleString();var r5=await fetch('/api/taxaties?limit=8',{headers:H()});var d5=await r5.json();var tbl=document.getElementById('hT');if((d5.items||d5.taxaties)?.length)tbl.innerHTML=(d5.items||d5.taxaties).map(function(t){return'<tr><td class="m">'+t.kenteken+'</td><td>'+t.make+' '+t.model+'</td><td class="dm">'+t.year+'</td><td class="m gr">'+E(t.handelswaarde||t.verkoopadviees)+'</td></tr>'}).join('');else tbl.innerHTML='<tr><td colspan="4" class="dm" style="text-align:center;padding:24px">Nog geen taxaties</td></tr>';var r6=await fetch('/api/notificaties',{headers:H()});var d6=await r6.json();var ha=document.getElementById('hA');if(d6.notificaties?.length)ha.innerHTML=d6.notificaties.slice(0,6).map(function(n){return'<div class="ar"><div class="ad" style="background:'+(n.read?'var(--text3)':'var(--green)')+'"></div><div class="at">'+n.title+'</div><div class="am">'+(n.message||'').slice(0,50)+'</div></div>'}).join('');else ha.innerHTML='<div class="dm" style="text-align:center;padding:16px">Geen meldingen</div>';var r7=await fetch('/api/dashboard/reprice',{headers:H()});var d7=await r7.json();var rp=document.getElementById('hR');if(d7.items?.length)rp.innerHTML=d7.items.slice(0,5).map(function(c){return'<tr><td>'+c.make+' '+c.model+'</td><td class="dm">'+c.stadagen+'d</td><td class="m">'+E(c.vraag_prijs)+'</td><td class="m gr">'+E(c.suggestie)+'</td></tr>'}).join('');else rp.innerHTML='<tr><td colspan="4" class="dm" style="text-align:center;padding:24px">Geen suggesties</td></tr>';var r8=await fetch('/api/inkoop',{headers:H()});var d8=await r8.json();var ii=d8.items||[];document.getElementById('sI').textContent=ii.length;var ip=document.getElementById('hI');if(ii.length)ip.innerHTML=ii.slice(0,5).map(function(i){var pl={nieuw:'pb',bod_gedaan:'po',ingekocht:'pg_',afgewezen:'pr'};return'<tr><td>'+(i.make||'')+' '+(i.model||'')+'</td><td class="m">'+E(i.ons_bod)+'</td><td><span class="p '+(pl[i.status]||'pb')+'">'+(i.status||'').replace('_',' ')+'</span></td></tr>'}).join('');else ip.innerHTML='<tr><td colspan="3" class="dm" style="text-align:center;padding:24px">Leeg</td></tr>'}catch(e){}}
